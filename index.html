<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NODAY Coffee Roasters | 線上點餐</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 pb-24">

  <header class="bg-[#213c64] text-white p-4 shadow-md sticky top-0 z-30">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-extrabold tracking-wide">NODAY Coffee Roasters</h1>
        <p class="text-xs text-amber-300 mt-0.5 flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 營業接單中
        </p>
      </div>
      <button onclick="openCart()" class="bg-amber-500 hover:bg-amber-600 text-white px-3.5 py-2 rounded-xl text-xs font-extrabold shadow flex items-center gap-1.5 transition">
        🛒 購物車 <span id="cart-badge" class="bg-white text-amber-700 px-1.5 py-0.5 rounded-full text-[10px]">0</span>
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <div class="bg-amber-50 border border-amber-200 p-3.5 rounded-2xl text-xs text-amber-900 shadow-sm space-y-1">
      <p class="font-extrabold flex items-center gap-1">📢 提醒事項</p>
      <p class="text-[11px] text-amber-800">彰化最早開的咖啡店，每日為你提供高品質的美味咖啡。</p>
    </div>

    <div class="bg-white p-3 rounded-2xl shadow-sm border flex gap-2">
      <button onclick="setOrderType('外帶自取')" id="type-takeout" class="flex-1 py-2 rounded-xl text-xs font-bold transition bg-[#213c64] text-white shadow">🥡 外帶自取</button>
      <button onclick="setOrderType('內用')" id="type-dinein" class="flex-1 py-2 rounded-xl text-xs font-bold transition bg-gray-100 text-gray-600">☕ 內用</button>
    </div>

    <div class="bg-white p-3 rounded-2xl shadow-sm border">
      <label class="text-[11px] font-extrabold text-gray-600 block mb-1">訂位人姓名 / 桌號 (必填)</label>
      <input type="text" id="customer-info" placeholder="例如：小鄭 / 桌號 3" class="w-full border rounded-xl p-2.5 text-xs focus:outline-none focus:border-[#2b4c7e] bg-gray-50">
    </div>

    <div id="category-tabs" class="flex gap-2 overflow-x-auto pb-1 no-scrollbar"></div>
    <div id="menu-container" class="space-y-6">
      <p class="text-center text-gray-400 py-10 text-xs">正在載入雲端菜單...</p>
    </div>
  </main>

  <!-- 客製化彈跳視窗 -->
  <div id="customize-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="flex justify-between items-start border-b pb-3">
        <div>
          <h3 id="modal-item-name" class="font-extrabold text-base text-gray-950">品項名稱</h3>
          <p id="modal-item-price" class="text-xs text-[#2b4c7e] font-extrabold mt-0.5">NT$0</p>
        </div>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg px-2">✕</button>
      </div>

      <div id="modal-options-container" class="space-y-4 text-xs"></div>

      <div>
        <label class="text-[11px] font-bold text-gray-600 block mb-1">備註說明 (選填)</label>
        <input type="text" id="modal-note" placeholder="例如：少冰、不要太甜" class="w-full border rounded-xl p-2.5 text-xs bg-gray-50 focus:outline-none focus:border-[#2b4c7e]">
      </div>

      <div class="flex items-center justify-between pt-2">
        <div class="flex items-center gap-3">
          <button onclick="adjustQty(-1)" class="w-9 h-9 rounded-xl border bg-gray-100 font-extrabold text-sm flex items-center justify-center">-</button>
          <span id="modal-qty" class="font-extrabold text-sm w-4 text-center">1</span>
          <button onclick="adjustQty(1)" class="w-9 h-9 rounded-xl border bg-gray-100 font-extrabold text-sm flex items-center justify-center">+</button>
        </div>
        <button onclick="confirmAddToCart()" class="bg-[#213c64] hover:bg-opacity-90 text-white px-6 py-3 rounded-xl font-extrabold text-xs shadow-lg">加入購物車</button>
      </div>
    </div>
  </div>

  <!-- 購物車抽屜 -->
  <div id="cart-drawer" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex justify-end">
    <div class="bg-white w-full max-w-sm h-full p-5 flex flex-col justify-between shadow-2xl">
      <div class="flex justify-between items-center border-b pb-3">
        <h2 class="font-extrabold text-base">🛒 您的購物車</h2>
        <button onclick="closeCart()" class="text-gray-400 font-bold text-lg">✕</button>
      </div>

      <div id="cart-items-list" class="flex-1 overflow-y-auto py-4 space-y-3">
        <p class="text-center text-gray-400 text-xs py-10">購物車目前是空的...</p>
      </div>

      <div class="border-t pt-4 space-y-3">
        <div class="flex justify-between items-center font-extrabold text-sm">
          <span>總計金額：</span>
          <span id="cart-total" class="text-amber-800 text-base">NT$0</span>
        </div>
        <button onclick="submitOrder()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-extrabold text-sm shadow-lg transition">
          🚀 確認送出訂單
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBMdycidtvbE7JmQtvXn-lCqUwod5RxR44",
      authDomain: "noday-coffee.firebaseapp.com",
      projectId: "noday-coffee",
      storageBucket: "noday-coffee.firebasestorage.app",
      messagingSenderId: "1001674084827",
      appId: "1:1001674084827:web:18b47455008c89e70b97fe"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let catalog = [];
    let cart = [];
    let currentOrderType = '外帶自取';
    let activeItem = null;
    let currentQty = 1;

    window.setOrderType = function(type) {
      currentOrderType = type;
      document.getElementById('type-takeout').className = type === '外帶自取' ? 'flex-1 py-2 rounded-xl text-xs font-bold transition bg-[#213c64] text-white shadow' : 'flex-1 py-2 rounded-xl text-xs font-bold transition bg-gray-100 text-gray-600';
      document.getElementById('type-dinein').className = type === '內用' ? 'flex-1 py-2 rounded-xl text-xs font-bold transition bg-[#213c64] text-white shadow' : 'flex-1 py-2 rounded-xl text-xs font-bold transition bg-gray-100 text-gray-600';
    };

    async function loadMenu() {
      try {
        const querySnapshot = await getDocs(collection(db, "menu"));
        if (querySnapshot.empty) return;
        catalog = [];
        querySnapshot.forEach(d => catalog.push(d.data()));
        catalog.sort((a, b) => a.order - b.order);
        renderMenu();
      } catch (e) { console.error(e); }
    }

    function renderMenu() {
      const tabs = document.getElementById('category-tabs');
      const container = document.getElementById('menu-container');

      tabs.innerHTML = catalog.map((cat, idx) => `
        <button onclick="scrollToCat('${cat.category}')" class="whitespace-nowrap px-3.5 py-1.5 rounded-xl text-xs font-bold ${idx === 0 ? 'bg-[#213c64] text-white' : 'bg-white text-gray-700 border'} shadow-sm">
          ${cat.category}
        </button>
      `).join('');

      container.innerHTML = catalog.map(cat => `
        <div id="cat-${cat.category}" class="space-y-3">
          <h2 class="font-extrabold text-sm text-[#213c64] border-b pb-1.5">${cat.category}</h2>
          <div class="grid grid-cols-1 gap-2.5">
            ${cat.items.map(item => `
              <div onclick="${item.soldOut ? '' : `openModal('${cat.category}', '${item.id}')`}" class="bg-white p-3.5 rounded-2xl border shadow-sm flex justify-between items-center ${item.soldOut ? 'opacity-50 bg-gray-100 cursor-not-allowed' : 'cursor-pointer hover:border-[#213c64] transition'}">
                <div class="space-y-1">
                  <h3 class="font-extrabold text-xs text-gray-900">${item.name}</h3>
                  ${item.desc ? `<p class="text-[11px] text-gray-500">${item.desc}</p>` : ''}
                  <p class="font-extrabold text-xs text-[#213c64]">NT$${item.price}</p>
                </div>
                <div>
                  ${item.soldOut ? '<span class="bg-red-500 text-white px-2.5 py-1 rounded-xl text-[10px] font-bold">已售完</span>' : '<span class="bg-gray-100 text-gray-700 px-3 py-1.5 rounded-xl text-xs font-bold">選購 ＋</span>'}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    window.scrollToCat = function(catName) {
      const el = document.getElementById(`cat-${catName}`);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    };

    window.openModal = function(catName, itemId) {
      const cat = catalog.find(c => c.category === catName);
      if (!cat) return;
      activeItem = cat.items.find(i => i.id === itemId);
      if (!activeItem) return;

      currentQty = 1;
      document.getElementById('modal-item-name').innerText = activeItem.name;
      document.getElementById('modal-qty').innerText = currentQty;
      document.getElementById('modal-note').value = '';

      const opts = activeItem.options || {};
      let html = '';

      // 溫度選項
      const temps = [];
      if (opts.ice) temps.push('冰');
      if (opts.hot) temps.push('熱');
      if (temps.length > 0) {
        html += `
          <div>
            <label class="font-bold text-gray-700 block mb-1">飲品溫度：</label>
            <div class="grid grid-cols-${temps.length} gap-2">
              ${temps.map((t, idx) => `
                <label class="border p-2 rounded-xl text-center cursor-pointer font-bold">
                  <input type="radio" name="opt-temp" value="${t}" ${idx === 0 ? 'checked' : ''} class="mr-1.5"> ${t}飲
                </label>
              `).join('')}
            </div>
          </div>
        `;
      }

      // 配方豆選項
      const beans = [];
      if (opts.bean5) beans.push({ name: '5號配方(經典)', price: opts.priceBean5 || 0 });
      if (opts.bean1) beans.push({ name: '1號配方(果香)', price: opts.priceBean1 || 0 });
      if (beans.length > 0) {
        html += `
          <div>
            <label class="font-bold text-gray-700 block mb-1">選擇配方豆：</label>
            <div class="grid grid-cols-${beans.length} gap-2">
              ${beans.map((b, idx) => `
                <label class="border p-2 rounded-xl text-center cursor-pointer font-bold text-[11px]">
                  <input type="radio" name="opt-bean" value="${b.name}" data-price="${b.price}" ${idx === 0 ? 'checked' : ''} class="mr-1 custom-bean-radio" onchange="updateModalPrice()"> ${b.name} ${b.price > 0 ? `(+$${b.price})` : ''}
                </label>
              `).join('')}
            </div>
          </div>
        `;
      }

      // 獨立甜度選項 (改為可單選的按鈕，帶各自加價)
      const sugars = [];
      if (opts.sugarFree) sugars.push({ name: '無糖', price: opts.priceSugarFree || 0 });
      if (opts.sugarMicro) sugars.push({ name: '微糖', price: opts.priceSugarMicro || 0 });
      if (opts.sugarHalf) sugars.push({ name: '半糖', price: opts.priceSugarHalf || 0 });
      if (opts.sugarNormal) sugars.push({ name: '正常甜', price: opts.priceSugarNormal || 0 });
      if (sugars.length > 0) {
        html += `
          <div>
            <label class="font-bold text-gray-700 block mb-1">甜度選擇：</label>
            <div class="grid grid-cols-${sugars.length > 2 ? 2 : sugars.length} gap-2">
              ${sugars.map((s, idx) => `
                <label class="border p-2 rounded-xl text-center cursor-pointer font-bold text-[11px]">
                  <input type="radio" name="opt-sugar" value="${s.name}" data-price="${s.price}" ${idx === 0 ? 'checked' : ''} class="mr-1 custom-sugar-radio" onchange="updateModalPrice()"> ${s.name} ${s.price > 0 ? `(+$${s.price})` : ''}
                </label>
              `).join('')}
            </div>
          </div>
        `;
      }

      // 自訂加價規則 (燕麥奶、可可粉、黑糖粉、肉桂粉等)
      if (activeItem.customRules) {
        const rules = activeItem.customRules.split(',').map(r => r.trim()).filter(Boolean);
        if (rules.length > 0) {
          html += `
            <div>
              <label class="font-bold text-gray-700 block mb-1">加價與客製選項：</label>
              <div class="space-y-2">
                ${rules.map(ruleStr => {
                  let parts = ruleStr.split(':');
                  let ruleName = parts[0].trim();
                  let rulePrice = parts[1] ? Number(parts[1]) : 0;
                  return `
                    <label class="flex items-center justify-between border p-2.5 rounded-xl cursor-pointer">
                      <span class="font-bold">${ruleName} ${rulePrice > 0 ? `(+NT$${rulePrice})` : ''}</span>
                      <input type="checkbox" name="custom-rule-option" data-price="${rulePrice}" value="${ruleName}${rulePrice > 0 ? ` (+NT$${rulePrice})` : ''}" class="w-4 h-4 text-[#213c64] custom-addon-checkbox" onchange="updateModalPrice()">
                    </label>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }
      }

      document.getElementById('modal-options-container').innerHTML = html;
      updateModalPrice();
      document.getElementById('customize-modal').classList.remove('hidden');
    };

    window.updateModalPrice = function() {
      if (!activeItem) return;
      let base = activeItem.price;

      // 配方豆加價
      const beanEl = document.querySelector('input[name="opt-bean"]:checked');
      if (beanEl) {
        base += Number(beanEl.getAttribute('data-price') || 0);
      }

      // 甜度加價
      const sugarEl = document.querySelector('input[name="opt-sugar"]:checked');
      if (sugarEl) {
        base += Number(sugarEl.getAttribute('data-price') || 0);
      }

      // 勾選的加價規則
      document.querySelectorAll('.custom-addon-checkbox:checked').forEach(el => {
        base += Number(el.getAttribute('data-price') || 0);
      });

      document.getElementById('modal-item-price').innerText = `NT$${base * currentQty}`;
    };

    window.closeModal = function() {
      document.getElementById('customize-modal').classList.add('hidden');
    };

    window.adjustQty = function(change) {
      currentQty += change;
      if (currentQty < 1) currentQty = 1;
      document.getElementById('modal-qty').innerText = currentQty;
      updateModalPrice();
    };

    window.confirmAddToCart = function() {
      if (!activeItem) return;
      const modifiers = [];
      let finalUnitPrice = activeItem.price;

      const tempEl = document.querySelector('input[name="opt-temp"]:checked');
      if (tempEl) modifiers.push(tempEl.value);

      const beanEl = document.querySelector('input[name="opt-bean"]:checked');
      if (beanEl) {
        modifiers.push(beanEl.value);
        finalUnitPrice += Number(beanEl.getAttribute('data-price') || 0);
      }

      const sugarEl = document.querySelector('input[name="opt-sugar"]:checked');
      if (sugarEl) {
        modifiers.push(sugarEl.value);
        finalUnitPrice += Number(sugarEl.getAttribute('data-price') || 0);
      }

      document.querySelectorAll('input[name="custom-rule-option"]:checked').forEach(el => {
        modifiers.push(el.value);
        let p = Number(el.getAttribute('data-price') || 0);
        finalUnitPrice += p;
      });

      const note = document.getElementById('modal-note').value.trim();

      cart.push({
        id: activeItem.id,
        name: activeItem.name,
        price: finalUnitPrice,
        qty: currentQty,
        modifiers: modifiers,
        note: note
      });

      updateCartBadge();
      closeModal();
      alert("✅ 已成功加入購物車！");
    };

    window.openCart = function() {
      const listEl = document.getElementById('cart-items-list');
      const totalEl = document.getElementById('cart-total');

      if (cart.length === 0) {
        listEl.innerHTML = `<p class="text-center text-gray-400 text-xs py-10">購物車目前是空的...</p>`;
        totalEl.innerText = 'NT$0';
      } else {
        let total = 0;
        listEl.innerHTML = cart.map((item, idx) => {
          const itemTotal = item.price * item.qty;
          total += itemTotal;
          return `
            <div class="flex justify-between items-center border-b pb-3 text-xs">
              <div>
                <p class="font-extrabold text-gray-900">${item.name} x${item.qty}</p>
                <p class="text-[11px] text-gray-500">${item.modifiers.join(' / ')} ${item.note ? `[${item.note}]` : ''}</p>
              </div>
              <div class="flex items-center gap-3">
                <span class="font-extrabold text-[#213c64]">NT$${itemTotal}</span>
                <button onclick="removeFromCart(${idx})" class="text-red-500 font-bold px-1.5 py-0.5 rounded bg-red-50">刪除</button>
              </div>
            </div>
          `;
        }).join('');
        totalEl.innerText = `NT$${total}`;
      }
      document.getElementById('cart-drawer').classList.remove('hidden');
    };

    window.closeCart = function() {
      document.getElementById('cart-drawer').classList.add('hidden');
    };

    window.removeFromCart = function(idx) {
      cart.splice(idx, 1);
      updateCartBadge();
      openCart();
    };

    function updateCartBadge() {
      const count = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cart-badge').innerText = count;
    }

    window.submitOrder = async function() {
      const customerInfo = document.getElementById('customer-info').value.trim();
      if (!customerInfo) { alert('請填寫訂位人姓名或桌號！'); return; }
      if (cart.length === 0) { alert('購物車是空的喔！'); return; }

      const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      try {
        await addDoc(collection(db, "orders"), {
          orderType: currentOrderType,
          customerInfo: customerInfo,
          items: cart,
          totalAmount: totalAmount,
          status: "pending",
          createdAt: serverTimestamp()
        });
        alert("🎉 訂單已成功送出！");
        cart = [];
        updateCartBadge();
        closeCart();
      } catch (e) { console.error(e); alert("送出失敗"); }
    };

    loadMenu();
  </script>
</body>
</html>
