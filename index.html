<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NODAY Coffee Roasters | 外帶線上點餐</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 pb-28">

  <!-- 頂部品牌列 -->
  <header class="bg-[#213c64] text-white p-4 shadow-md sticky top-0 z-30">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-lg font-extrabold tracking-wide">NODAY Coffee Roasters</h1>
        <p id="store-status-header" class="text-[11px] text-amber-300 mt-0.5 flex items-center gap-1.5">
          <span id="store-status-dot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="store-status-label">載入營業狀態中...</span>
        </p>
      </div>
      <button onclick="openCart()" class="bg-amber-500 hover:bg-amber-600 text-white px-3.5 py-2 rounded-xl text-xs font-extrabold shadow flex items-center gap-1.5 transition">
        🛒 購物車 <span id="cart-badge" class="bg-white text-amber-700 px-1.5 py-0.5 rounded-full text-[10px]">0</span>
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- 非營業時間 / 預約休假 醒目提示卡 (非營業時自動顯示) -->
    <div id="closed-notice-banner" class="hidden bg-red-50 border-2 border-red-400 p-4 rounded-2xl shadow-sm space-y-1.5">
      <div class="flex justify-between items-center">
        <p id="closed-notice-title" class="text-sm font-extrabold text-red-700">🌙 目前非營業時間（僅供瀏覽菜單）</p>
        <button onclick="toggleScheduleModal()" class="text-[11px] bg-white border border-red-300 text-red-700 px-2.5 py-1 rounded-lg font-bold">查看營業時間</button>
      </div>
      <p id="closed-notice-sub" class="text-xs text-red-600 font-bold">您仍可瀏覽完整菜單與價格，營業時間開始後即可下單。</p>
    </div>

    <!-- 即時訂單狀態追蹤卡 (含取餐號碼牌與取餐提醒音效) -->
    <div id="active-order-banner" class="hidden bg-white border-2 border-[#213c64] p-4 rounded-2xl shadow-md space-y-2">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-2">
          <span id="order-number-badge" class="bg-[#213c64] text-white text-sm font-extrabold px-3 py-1 rounded-xl">#001</span>
          <span class="text-xs font-extrabold text-[#213c64]">外帶取餐進度</span>
        </div>
        <span id="order-status-badge" class="bg-amber-100 text-amber-800 text-xs font-extrabold px-2.5 py-1 rounded-full">⏳ 等待吧台接單</span>
      </div>
      <p id="order-status-text" class="text-xs text-gray-700 font-bold">訂單已送出，等待吧台人員確認接單中...</p>
    </div>

    <!-- 店家動態公告 (由後台即時同步) -->
    <div class="bg-amber-50 border border-amber-200 p-3.5 rounded-2xl text-xs text-amber-900 shadow-sm space-y-1">
      <div class="flex justify-between items-center">
        <p id="ann-title" class="font-extrabold flex items-center gap-1">📢 外帶取餐提醒</p>
        <button onclick="toggleScheduleModal()" class="text-[11px] text-[#213c64] underline font-bold">營業與休假時間</button>
      </div>
      <p id="ann-text" class="text-[11px] text-amber-800 whitespace-pre-line leading-relaxed">本店為外帶專門店（無內用），現點現做請耐心等候。</p>
    </div>

    <!-- 熟客快速點餐：上次點的咖啡 (一鍵再買一次) -->
    <div id="reorder-section" class="hidden bg-white p-3.5 rounded-2xl shadow-sm border border-blue-100 space-y-2">
      <div class="flex justify-between items-center">
        <span class="text-xs font-extrabold text-[#213c64]">🔄 熟客快速點餐（您上次點的咖啡）</span>
        <button onclick="reorderLastItems()" class="bg-[#213c64] hover:bg-[#192e4d] text-white px-3 py-1 rounded-lg text-[11px] font-extrabold shadow-sm transition">
          ＋ 一鍵再買一次
        </button>
      </div>
      <p id="reorder-summary" class="text-[11px] text-gray-600 font-bold"></p>
    </div>

    <!-- 取餐人姓名、電話 ＆ 預計取餐時間 -->
    <div class="bg-white p-3.5 rounded-2xl shadow-sm border space-y-3">
      <div class="grid grid-cols-2 gap-2.5">
        <div>
          <label class="text-[11px] font-extrabold text-gray-600 block mb-1">取餐人姓名 <span class="text-red-500">*</span></label>
          <input type="text" id="customer-name" placeholder="例如：王小明" class="w-full border rounded-xl p-2.5 text-xs focus:outline-none focus:border-[#213c64] bg-gray-50 font-bold">
        </div>
        <div>
          <label class="text-[11px] font-extrabold text-gray-600 block mb-1">連絡電話 <span class="text-red-500">*</span></label>
          <input type="tel" id="customer-phone" placeholder="0912345678" class="w-full border rounded-xl p-2.5 text-xs focus:outline-none focus:border-[#213c64] bg-gray-50 font-bold">
        </div>
      </div>

      <!-- 預計取餐時間選擇 -->
      <div class="pt-1 border-t">
        <label class="text-[11px] font-extrabold text-gray-600 block mb-1.5">⏰ 預計取餐時間：</label>
        <div class="grid grid-cols-4 gap-1.5 text-[11px]">
          <button type="button" onclick="selectPickupMode('現場立即製作')" id="pk-now" class="py-2 rounded-xl font-extrabold border bg-[#213c64] text-white">立即製作</button>
          <button type="button" onclick="selectPickupMode('15分鐘後取餐')" id="pk-15" class="py-2 rounded-xl font-bold border bg-gray-50 text-gray-700">15分後</button>
          <button type="button" onclick="selectPickupMode('30分鐘後取餐')" id="pk-30" class="py-2 rounded-xl font-bold border bg-gray-50 text-gray-700">30分後</button>
          <button type="button" onclick="selectPickupMode('custom')" id="pk-custom" class="py-2 rounded-xl font-bold border bg-gray-50 text-gray-700">指定時間</button>
        </div>
        <div id="custom-pickup-box" class="hidden mt-2 flex items-center gap-2">
          <span class="text-xs font-bold text-gray-600">選擇取餐時間：</span>
          <input type="time" id="custom-pickup-time" class="border rounded-xl p-2 text-xs font-extrabold bg-gray-50 flex-1">
        </div>
      </div>
    </div>

    <!-- 分類橫向導覽列 -->
    <div id="category-tabs" class="flex gap-2 overflow-x-auto py-1 sticky top-[68px] bg-gray-50/95 backdrop-blur z-20 no-scrollbar"></div>

    <!-- 菜單列表 -->
    <div id="menu-container" class="space-y-6">
      <p class="text-center text-gray-400 py-10 text-xs">正在載入雲端菜單...</p>
    </div>
  </main>

  <!-- 底部懸浮購物車結帳列 -->
  <div id="bottom-cart-bar" class="fixed bottom-0 inset-x-0 p-3 bg-white/95 backdrop-blur border-t shadow-2xl z-30 hidden">
    <div class="max-w-md mx-auto flex items-center justify-between gap-3">
      <div onclick="openCart()" class="cursor-pointer">
        <p class="text-[11px] text-gray-500 font-bold">已選購 <span id="bottom-cart-count" class="text-[#213c64] font-extrabold">0</span> 杯飲品/商品</p>
        <p id="bottom-cart-total" class="text-base font-extrabold text-amber-800">NT$0</p>
      </div>
      <button onclick="openCart()" class="bg-[#213c64] hover:bg-[#192e4d] text-white px-6 py-3 rounded-xl font-extrabold text-xs shadow-lg transition">
        前往結帳送單 ➔
      </button>
    </div>
  </div>

  <!-- 加入購物車輕提示 (Toast) -->
  <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 bg-gray-900/90 text-white px-4 py-2 rounded-full text-xs font-bold shadow-lg hidden z-50">
    ✅ 已加入購物車
  </div>

  <!-- 營業時間與公休日說明視窗 -->
  <div id="schedule-modal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-extrabold text-base text-[#213c64]">🕒 營業時間 ＆ 休假公告</h3>
        <button onclick="toggleScheduleModal()" class="text-gray-400 font-bold text-lg">✕</button>
      </div>
      <div id="schedule-modal-body" class="space-y-2 text-xs"></div>
    </div>
  </div>

  <!-- 飲品客製與加購彈跳視窗 -->
  <div id="customize-modal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 space-y-4 max-h-[88vh] overflow-y-auto shadow-2xl">
      <div class="flex justify-between items-start border-b pb-3">
        <div>
          <h3 id="modal-item-name" class="font-extrabold text-base text-gray-950">品項名稱</h3>
          <p id="modal-item-desc" class="text-[11px] text-gray-500 mt-0.5"></p>
        </div>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg px-2">✕</button>
      </div>

      <div id="modal-options-container" class="space-y-4 text-xs"></div>

      <div>
        <label class="text-[11px] font-bold text-gray-600 block mb-1">特別備註 (選填)</label>
        <input type="text" id="modal-note" placeholder="例如：杯蓋貼紙註記、分開裝" class="w-full border rounded-xl p-2.5 text-xs bg-gray-50 focus:outline-none focus:border-[#213c64]">
      </div>

      <div class="flex items-center justify-between pt-2 border-t">
        <div class="flex items-center gap-3">
          <button onclick="adjustQty(-1)" class="w-9 h-9 rounded-xl border bg-gray-100 font-extrabold text-base flex items-center justify-center">-</button>
          <span id="modal-qty" class="font-extrabold text-sm w-5 text-center">1</span>
          <button onclick="adjustQty(1)" class="w-9 h-9 rounded-xl border bg-gray-100 font-extrabold text-base flex items-center justify-center">+</button>
        </div>
        <button id="modal-add-btn" onclick="confirmAddToCart()" class="bg-[#213c64] hover:bg-opacity-90 text-white px-6 py-3 rounded-xl font-extrabold text-xs shadow-lg flex items-center gap-2">
          <span id="modal-add-btn-text">加入購物車</span>
          <span id="modal-item-price" class="bg-white/20 px-2 py-0.5 rounded-lg">NT$0</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 購物車抽屜 -->
  <div id="cart-drawer" class="fixed inset-0 bg-black/60 hidden z-50 flex justify-end">
    <div class="bg-white w-full max-w-sm h-full p-5 flex flex-col justify-between shadow-2xl">
      <div class="flex justify-between items-center border-b pb-3">
        <h2 class="font-extrabold text-base">🛒 外帶購物車明細</h2>
        <button onclick="closeCart()" class="text-gray-400 font-bold text-lg px-2">✕</button>
      </div>

      <div id="cart-items-list" class="flex-1 overflow-y-auto py-4 space-y-3">
        <p class="text-center text-gray-400 text-xs py-10">購物車目前是空的...</p>
      </div>

      <div class="border-t pt-4 space-y-3">
        <div class="flex justify-between items-center font-extrabold text-sm">
          <span>外帶應付總計：</span>
          <span id="cart-total" class="text-amber-800 text-lg">NT$0</span>
        </div>
        <button onclick="submitOrder()" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-extrabold text-sm shadow-lg transition">
          🚀 確認送出外帶訂單
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBMdycidtvbE7JmQtvXn-lCqUwod5RxR44",
      authDomain: "noday-coffee.firebaseapp.com",
      projectId: "noday-coffee",
      storageBucket: "noday-coffee.firebasestorage.app",
      messagingSenderId: "1001674084827",
      appId: "1:1001674084827:web:18b47455008c89e70b97fe"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let catalog = [];
    let cart = [];
    let activeItem = null;
    let currentQty = 1;
    let pickupMode = "現場立即製作";
    let isStoreCurrentlyOpen = true;
    let storeCloseReason = "";
    let latestStoreSettings = {};
    let customerAudioCtx = null;

    // 載入記憶的顧客姓名電話與熟客上次訂單
    document.getElementById('customer-name').value = localStorage.getItem('noday_name') || '';
    document.getElementById('customer-phone').value = localStorage.getItem('noday_phone') || '';

    function loadLastOrderHistory() {
      try {
        const lastItems = JSON.parse(localStorage.getItem('noday_last_order') || '[]');
        if (Array.isArray(lastItems) && lastItems.length > 0) {
          document.getElementById('reorder-section').classList.remove('hidden');
          document.getElementById('reorder-summary').innerText = lastItems.map(i => `${i.name} x${i.qty} (${(i.modifiers || []).join('/')})`).join('、');
        }
      } catch (e) {}
    }
    loadLastOrderHistory();

    window.reorderLastItems = function() {
      if (!isStoreCurrentlyOpen) {
        alert(`抱歉，${storeCloseReason}，目前僅供瀏覽菜單喔！`);
        return;
      }
      try {
        const lastItems = JSON.parse(localStorage.getItem('noday_last_order') || '[]');
        if (lastItems.length > 0) {
          lastItems.forEach(i => cart.push({ ...i }));
          updateCartBadge();
          showToast("✅ 已將上次點的咖啡加入購物車！");
        }
      } catch (e) {}
    };

    // 選擇預計取餐時間
    window.selectPickupMode = function(mode) {
      pickupMode = mode;
      const modes = { '現場立即製作': 'pk-now', '15分鐘後取餐': 'pk-15', '30分鐘後取餐': 'pk-30', 'custom': 'pk-custom' };
      Object.entries(modes).forEach(([k, id]) => {
        document.getElementById(id).className = (k === mode)
          ? "py-2 rounded-xl font-extrabold border bg-[#213c64] text-white"
          : "py-2 rounded-xl font-bold border bg-gray-50 text-gray-700";
      });
      const customBox = document.getElementById('custom-pickup-box');
      if (mode === 'custom') customBox.classList.remove('hidden');
      else customBox.classList.add('hidden');
    };

    // ==================== 監聽店家營業狀態、營業時間、休假與公告 ====================
    const dayNames = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];

    function evaluateOpenStatus(settings) {
      const mode = settings.storeMode || 'auto';
      if (mode === 'open') return { isOpen: true, reason: '外帶自取・營業接單中', sub: '' };
      if (mode === 'closed') return { isOpen: false, reason: '目前店家暫停接單 / 休息中', sub: '目前僅供瀏覽菜單，暫無法點餐' };

      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const todayStr = `${yyyy}-${mm}-${dd}`;
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const dayIdx = String(now.getDay());

      const matchedHoliday = (settings.holidays || []).find(h => todayStr >= h.startDate && todayStr <= h.endDate);
      if (matchedHoliday) {
        return {
          isOpen: false,
          reason: `今日店休（${matchedHoliday.note || '預約公休'}）`,
          sub: `休假期間：${matchedHoliday.startDate} ~ ${matchedHoliday.endDate}｜目前僅供瀏覽菜單`
        };
      }

      const wh = settings.weeklyHours || {};
      const dayCfg = wh[dayIdx] || { open: true, start: "07:00", end: "17:00" };
      if (!dayCfg.open) {
        return { isOpen: false, reason: `今日固定公休（${dayNames[now.getDay()]}）`, sub: '目前僅供瀏覽菜單，歡迎於營業日再度光臨' };
      }
      if (timeStr < dayCfg.start || timeStr > dayCfg.end) {
        return { isOpen: false, reason: '目前非營業時間（僅供瀏覽菜單）', sub: `今日營業時間：${dayCfg.start} - ${dayCfg.end}｜歡迎先瀏覽菜單` };
      }
      return { isOpen: true, reason: `營業接單中（今日至 ${dayCfg.end}）`, sub: '' };
    }

    function applyStoreStatusUI() {
      const st = evaluateOpenStatus(latestStoreSettings);
      isStoreCurrentlyOpen = st.isOpen;
      storeCloseReason = st.reason;

      const dot = document.getElementById('store-status-dot');
      const label = document.getElementById('store-status-label');
      const closedBanner = document.getElementById('closed-notice-banner');
      const submitBtn = document.getElementById('submit-btn');

      label.innerText = st.reason;
      if (st.isOpen) {
        dot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
        closedBanner.classList.add('hidden');
        submitBtn.disabled = false;
        submitBtn.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-extrabold text-sm shadow-lg transition";
        submitBtn.innerText = "🚀 確認送出外帶訂單";
      } else {
        dot.className = "w-2 h-2 rounded-full bg-red-400";
        closedBanner.classList.remove('hidden');
        document.getElementById('closed-notice-title').innerText = `🌙 ${st.reason}`;
        document.getElementById('closed-notice-sub').innerText = st.sub;
        submitBtn.disabled = true;
        submitBtn.className = "w-full bg-gray-400 text-white py-3.5 rounded-xl font-extrabold text-sm cursor-not-allowed";
        submitBtn.innerText = "🌙 非營業時間（僅供瀏覽菜單）";
      }
    }

    onSnapshot(doc(db, "settings", "store"), (snap) => {
      if (snap.exists()) {
        latestStoreSettings = snap.data();
        if (latestStoreSettings.announcementTitle) {
          document.getElementById('ann-title').innerText = latestStoreSettings.announcementTitle;
        }
        if (latestStoreSettings.announcementText) {
          document.getElementById('ann-text').innerText = latestStoreSettings.announcementText;
        }
      }
      applyStoreStatusUI();
    });
    setInterval(applyStoreStatusUI, 30000);

    window.toggleScheduleModal = function() {
      const modal = document.getElementById('schedule-modal');
      const body = document.getElementById('schedule-modal-body');
      const wh = latestStoreSettings.weeklyHours || {};
      const holidays = latestStoreSettings.holidays || [];
      const orderDays = [1, 2, 3, 4, 5, 6, 0];

      let html = `<div class="space-y-1.5"><p class="font-extrabold text-gray-700">📅 每週營業時間：</p>`;
      orderDays.forEach(d => {
        const cfg = wh[String(d)] || { open: true, start: "07:00", end: "17:00" };
        html += `
          <div class="flex justify-between py-1 border-b">
            <span class="font-bold">${dayNames[d]}</span>
            <span class="${cfg.open ? 'text-emerald-700 font-extrabold' : 'text-red-500 font-bold'}">${cfg.open ? `${cfg.start} - ${cfg.end}` : '公休'}</span>
          </div>
        `;
      });
      html += `</div>`;

      if (holidays.length > 0) {
        html += `<div class="pt-2 space-y-1"><p class="font-extrabold text-red-700">🏖️ 近期店休預告：</p>`;
        holidays.forEach(h => {
          html += `<p class="bg-red-50 text-red-700 p-2 rounded-lg font-bold">${h.startDate} ~ ${h.endDate}：${h.note || '店休'}</p>`;
        });
        html += `</div>`;
      }
      body.innerHTML = html;
      modal.classList.toggle('hidden');
    };

    // ==================== 載入與渲染菜單 ====================
    async function loadMenu() {
      try {
        const querySnapshot = await getDocs(collection(db, "menu"));
        if (querySnapshot.empty) return;
        catalog = [];
        querySnapshot.forEach(d => catalog.push(d.data()));
        catalog.sort((a, b) => a.order - b.order);
        renderMenu();
      } catch (e) { console.error(e); }
    }

    function renderMenu() {
      const tabs = document.getElementById('category-tabs');
      const container = document.getElementById('menu-container');

      tabs.innerHTML = catalog.map((cat, idx) => `
        <button onclick="scrollToCat('${cat.category}')" class="whitespace-nowrap px-3.5 py-1.5 rounded-xl text-xs font-bold ${idx === 0 ? 'bg-[#213c64] text-white' : 'bg-white text-gray-700 border'} shadow-sm">
          ${cat.category}
        </button>
      `).join('');

      container.innerHTML = catalog.map(cat => `
        <div id="cat-${cat.category}" class="space-y-3 scroll-mt-28">
          <h2 class="font-extrabold text-sm text-[#213c64] border-b pb-1.5">${cat.category}</h2>
          <div class="grid grid-cols-1 gap-2.5">
            ${cat.items.map(item => `
              <div onclick="${item.soldOut ? '' : `openModal('${cat.category}', '${item.id}')`}" class="bg-white p-3.5 rounded-2xl border shadow-sm flex justify-between items-center ${item.soldOut ? 'opacity-50 bg-gray-100 cursor-not-allowed' : 'cursor-pointer hover:border-[#213c64] active:scale-[0.99] transition'}">
                <div class="space-y-1 pr-3">
                  <h3 class="font-extrabold text-xs text-gray-900">${item.name}</h3>
                  ${item.desc ? `<p class="text-[11px] text-gray-500 leading-relaxed">${item.desc}</p>` : ''}
                  <p class="font-extrabold text-xs text-[#213c64] pt-0.5">NT$${item.price}</p>
                </div>
                <div class="shrink-0">
                  ${item.soldOut ? '<span class="bg-red-500 text-white px-2.5 py-1 rounded-xl text-[10px] font-bold">已售完</span>' : '<span class="bg-[#213c64]/10 text-[#213c64] px-3 py-1.5 rounded-xl text-xs font-extrabold">查看 / 選購</span>'}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    window.scrollToCat = function(catName) {
      const el = document.getElementById(`cat-${catName}`);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    };

    function getActiveAddonsList(item) {
      const opts = item.options || {};
      const list = [];
      if (opts.addonShot !== undefined) {
        if (opts.addonShot) list.push({ name: '加一份濃縮', price: Number(opts.priceAddonShot || 0) });
        if (opts.addonOat) list.push({ name: '更換燕麥奶', price: Number(opts.priceAddonOat || 0) });
        if (opts.addonCocoa) list.push({ name: '可可粉', price: Number(opts.priceAddonCocoa || 0) });
        if (opts.addonBrownSugar) list.push({ name: '黑糖粉', price: Number(opts.priceAddonBrownSugar || 0) });
        if (opts.addonCinnamon) list.push({ name: '肉桂粉', price: Number(opts.priceAddonCinnamon || 0) });
        if (Array.isArray(opts.extraAddons)) {
          opts.extraAddons.forEach(a => {
            if (a.enabled && a.name) list.push({ name: a.name, price: Number(a.price || 0) });
          });
        }
      }
      return list;
    }

    window.toggleIceLevelBox = function() {
      const tempEl = document.querySelector('input[name="opt-temp"]:checked');
      const box = document.getElementById('ice-level-box');
      if (!box) return;
      if (tempEl && tempEl.value === '冰飲') box.classList.remove('hidden');
      else box.classList.add('hidden');
    };

    window.openModal = function(catName, itemId) {
      const cat = catalog.find(c => c.category === catName);
      if (!cat) return;
      activeItem = cat.items.find(i => i.id === itemId);
      if (!activeItem) return;

      currentQty = 1;
      document.getElementById('modal-item-name').innerText = activeItem.name;
      document.getElementById('modal-item-desc').innerText = activeItem.desc || '';
      document.getElementById('modal-qty').innerText = currentQty;
      document.getElementById('modal-note').value = '';

      const opts = activeItem.options || {};
      let html = '';

      // 1. 溫度選擇 ＋ 冰量細項選擇
      const temps = [];
      if (opts.ice) temps.push('冰');
      if (opts.hot) temps.push('熱');
      if (temps.length > 0) {
        html += `
          <div>
            <label class="font-extrabold text-gray-700 block mb-1.5">🌡️ 飲品溫度 (必選)：</label>
            <div class="grid grid-cols-2 gap-2">
              ${temps.map((t, idx) => `
                <label class="cursor-pointer">
                  <input type="radio" name="opt-temp" value="${t}飲" ${idx === 0 ? 'checked' : ''} class="peer hidden" onchange="toggleIceLevelBox()">
                  <div class="border rounded-xl p-2.5 text-center font-bold peer-checked:bg-[#213c64] peer-checked:text-white peer-checked:border-[#213c64] transition">${t}飲</div>
                </label>
              `).join('')}
            </div>
          </div>
        `;
      }

      if (opts.ice && opts.iceLevel !== false) {
        const iceLevels = ['正常冰', '少冰', '微冰', '去冰'];
        html += `
          <div id="ice-level-box">
            <label class="font-extrabold text-gray-700 block mb-1.5">🧊 冰量選擇：</label>
            <div class="grid grid-cols-4 gap-1.5">
              ${iceLevels.map((lvl, idx) => `
                <label class="cursor-pointer">
                  <input type="radio" name="opt-ice-level" value="${lvl}" ${idx === 0 ? 'checked' : ''} class="peer hidden">
                  <div class="border rounded-xl py-2 text-center font-bold text-[11px] peer-checked:bg-sky-700 peer-checked:text-white peer-checked:border-sky-700 transition">${lvl}</div>
                </label>
              `).join('')}
            </div>
          </div>
        `;
      }

      // 2. 配方豆選擇
      const beans = [];
      if (opts.bean5) beans.push({ name: '5號配方(經典)', price: Number(opts.priceBean5 || 0) });
      if (opts.bean1) beans.push({ name: '1號配方(果香)', price: Number(opts.priceBean1 || 0) });
      if (beans.length > 0) {
        html += `
          <div>
            <label class="font-extrabold text-gray-700 block mb-1.5">🫘 選擇配方豆 (必選)：</label>
            <div class="grid grid-cols-2 gap-2">
              ${beans.map((b, idx) => `
                <label class="cursor-pointer">
                  <input type="radio" name="opt-bean" value="${b.name}" data-price="${b.price}" ${idx === 0 ? 'checked' : ''} class="peer hidden" onchange="updateModalPrice()">
                  <div class="border rounded-xl p-2.5 text-center font-bold text-[11px] peer-checked:bg-[#213c64] peer-checked:text-white peer-checked:border-[#213c64] transition">
                    ${b.name} ${b.price > 0 ? `(+NT$${b.price})` : ''}
                  </div>
                </label>
              `).join('')}
            </div>
          </div>
        `;
      }

      // 3. 甜度選擇
      const sugars = [];
      if (opts.sugarFree) sugars.push({ name: '無糖', price: Number(opts.priceSugarFree || 0) });
      if (opts.sugarMicro) sugars.push({ name: '微糖', price: Number(opts.priceSugarMicro || 0) });
      if (opts.sugarHalf) sugars.push({ name: '半糖', price: Number(opts.priceSugarHalf || 0) });
      if (opts.sugarNormal) sugars.push({ name: '正常甜', price: Number(opts.priceSugarNormal || 0) });
      if (sugars.length > 0) {
        html += `
          <div>
            <label class="font-extrabold text-gray-700 block mb-1.5">🍯 甜度選擇 (必選)：</label>
            <div class="grid grid-cols-2 gap-2">
              ${sugars.map((s, idx) => `
                <label class="cursor-pointer">
                  <input type="radio" name="opt-sugar" value="${s.name}" data-price="${s.price}" ${idx === 0 ? 'checked' : ''} class="peer hidden" onchange="updateModalPrice()">
                  <div class="border rounded-xl p-2.5 text-center font-bold text-[11px] peer-checked:bg-[#213c64] peer-checked:text-white peer-checked:border-[#213c64] transition">
                    ${s.name} ${s.price > 0 ? `(+NT$${s.price})` : ''}
                  </div>
                </label>
              `).join('')}
            </div>
          </div>
        `;
      }

      // 4. 加購區
      const addonsList = getActiveAddonsList(activeItem);
      if (addonsList.length > 0) {
        html += `
          <div>
            <label class="font-extrabold text-[#213c64] block mb-1.5">🎁 加購區 (可複選)：</label>
            <div class="space-y-2">
              ${addonsList.map(addon => `
                <label class="flex items-center justify-between border rounded-xl p-3 cursor-pointer bg-amber-50/40 hover:bg-amber-50 transition">
                  <span class="font-bold text-gray-800">${addon.name} ${addon.price > 0 ? `<span class="text-amber-700">(+NT$${addon.price})</span>` : ''}</span>
                  <input type="checkbox" name="custom-rule-option" data-price="${addon.price}" value="${addon.name}${addon.price > 0 ? ` (+NT$${addon.price})` : ''}" class="w-4 h-4 accent-[#213c64] custom-addon-checkbox" onchange="updateModalPrice()">
                </label>
              `).join('')}
            </div>
          </div>
        `;
      }

      document.getElementById('modal-options-container').innerHTML = html;
      toggleIceLevelBox();
      updateModalPrice();

      // 非營業時間僅供瀏覽，鎖定加入購物車按鈕
      const addBtn = document.getElementById('modal-add-btn');
      const addBtnText = document.getElementById('modal-add-btn-text');
      if (isStoreCurrentlyOpen) {
        addBtn.disabled = false;
        addBtn.className = "bg-[#213c64] hover:bg-opacity-90 text-white px-6 py-3 rounded-xl font-extrabold text-xs shadow-lg flex items-center gap-2";
        addBtnText.innerText = "加入購物車";
      } else {
        addBtn.disabled = true;
        addBtn.className = "bg-gray-400 text-white px-5 py-3 rounded-xl font-extrabold text-xs cursor-not-allowed flex items-center gap-2";
        addBtnText.innerText = "🌙 非營業時間僅供瀏覽";
      }

      document.getElementById('customize-modal').classList.remove('hidden');
    };

    window.updateModalPrice = function() {
      if (!activeItem) return;
      let base = activeItem.price;

      const beanEl = document.querySelector('input[name="opt-bean"]:checked');
      if (beanEl) base += Number(beanEl.getAttribute('data-price') || 0);

      const sugarEl = document.querySelector('input[name="opt-sugar"]:checked');
      if (sugarEl) base += Number(sugarEl.getAttribute('data-price') || 0);

      document.querySelectorAll('.custom-addon-checkbox:checked').forEach(el => {
        base += Number(el.getAttribute('data-price') || 0);
      });

      document.getElementById('modal-item-price').innerText = `NT$${base * currentQty}`;
    };

    window.closeModal = function() {
      document.getElementById('customize-modal').classList.add('hidden');
    };

    window.adjustQty = function(change) {
      currentQty += change;
      if (currentQty < 1) currentQty = 1;
      document.getElementById('modal-qty').innerText = currentQty;
      updateModalPrice();
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2000);
    }

    window.confirmAddToCart = function() {
      if (!isStoreCurrentlyOpen) {
        alert(`抱歉，${storeCloseReason}，目前僅供瀏覽菜單喔！`);
        return;
      }
      if (!activeItem) return;
      const modifiers = [];
      let finalUnitPrice = activeItem.price;

      const tempEl = document.querySelector('input[name="opt-temp"]:checked');
      if (tempEl) {
        modifiers.push(tempEl.value);
        if (tempEl.value === '冰飲') {
          const iceLvlEl = document.querySelector('input[name="opt-ice-level"]:checked');
          if (iceLvlEl) modifiers.push(iceLvlEl.value);
        }
      }

      const beanEl = document.querySelector('input[name="opt-bean"]:checked');
      if (beanEl) {
        const p = Number(beanEl.getAttribute('data-price') || 0);
        modifiers.push(p > 0 ? `${beanEl.value}(+$${p})` : beanEl.value);
        finalUnitPrice += p;
      }

      const sugarEl = document.querySelector('input[name="opt-sugar"]:checked');
      if (sugarEl) {
        const p = Number(sugarEl.getAttribute('data-price') || 0);
        modifiers.push(p > 0 ? `${sugarEl.value}(+$${p})` : sugarEl.value);
        finalUnitPrice += p;
      }

      document.querySelectorAll('input[name="custom-rule-option"]:checked').forEach(el => {
        modifiers.push(el.value);
        finalUnitPrice += Number(el.getAttribute('data-price') || 0);
      });

      const note = document.getElementById('modal-note').value.trim();

      cart.push({
        id: activeItem.id,
        name: activeItem.name,
        price: finalUnitPrice,
        qty: currentQty,
        modifiers: modifiers,
        note: note
      });

      updateCartBadge();
      closeModal();
      showToast(`✅ 已加入：${activeItem.name} x${currentQty}`);
    };

    window.openCart = function() {
      const listEl = document.getElementById('cart-items-list');
      const totalEl = document.getElementById('cart-total');

      if (cart.length === 0) {
        listEl.innerHTML = `<p class="text-center text-gray-400 text-xs py-10">購物車目前是空的...</p>`;
        totalEl.innerText = 'NT$0';
      } else {
        let total = 0;
        listEl.innerHTML = cart.map((item, idx) => {
          const itemTotal = item.price * item.qty;
          total += itemTotal;
          return `
            <div class="flex justify-between items-center border-b pb-3 text-xs">
              <div class="pr-2">
                <p class="font-extrabold text-gray-900">${item.name} x${item.qty}</p>
                <p class="text-[11px] text-gray-500 mt-0.5">${item.modifiers.join(' / ')} ${item.note ? `[備註: ${item.note}]` : ''}</p>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <span class="font-extrabold text-[#213c64]">NT$${itemTotal}</span>
                <button onclick="removeFromCart(${idx})" class="text-red-500 font-bold px-2 py-1 rounded-lg bg-red-50">刪除</button>
              </div>
            </div>
          `;
        }).join('');
        totalEl.innerText = `NT$${total}`;
      }
      document.getElementById('cart-drawer').classList.remove('hidden');
    };

    window.closeCart = function() {
      document.getElementById('cart-drawer').classList.add('hidden');
    };

    window.removeFromCart = function(idx) {
      cart.splice(idx, 1);
      updateCartBadge();
      openCart();
    };

    function updateCartBadge() {
      const count = cart.reduce((sum, item) => sum + item.qty, 0);
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      document.getElementById('cart-badge').innerText = count;
      document.getElementById('bottom-cart-count').innerText = count;
      document.getElementById('bottom-cart-total').innerText = `NT$${total}`;

      const bottomBar = document.getElementById('bottom-cart-bar');
      if (count > 0) bottomBar.classList.remove('hidden');
      else bottomBar.classList.add('hidden');
    }

    // 客人手機取餐完成提示音與震動
    function playPickupReadyChime() {
      try {
        if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 500]);
        if (!customerAudioCtx) customerAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (customerAudioCtx.state === 'suspended') customerAudioCtx.resume();
        const now = customerAudioCtx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = customerAudioCtx.createOscillator();
          const gain = customerAudioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, now + idx * 0.15);
          gain.gain.setValueAtTime(0.4, now + idx * 0.15);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.15 + 0.35);
          osc.connect(gain);
          gain.connect(customerAudioCtx.destination);
          osc.start(now + idx * 0.15);
          osc.stop(now + idx * 0.15 + 0.35);
        });
      } catch (e) {}
    }

    // 追蹤剛送出的訂單狀態 (未接單 -> 製作中 -> 可取餐)
    function watchOrderStatus(orderId) {
      const banner = document.getElementById('active-order-banner');
      const numBadge = document.getElementById('order-number-badge');
      const badge = document.getElementById('order-status-badge');
      const text = document.getElementById('order-status-text');
      banner.classList.remove('hidden');
      let notifiedCompleted = false;

      onSnapshot(doc(db, "orders", orderId), (snap) => {
        if (!snap.exists()) return;
        const data = snap.data();
        numBadge.innerText = data.orderNumber || '#001';

        if (data.status === 'completed') {
          badge.className = "bg-emerald-600 text-white text-xs font-extrabold px-3 py-1 rounded-full animate-bounce";
          badge.innerText = "🎉 製作完成・請取餐";
          text.innerText = `親愛的 ${data.customerInfo}，您的餐點好囉！請憑號碼牌【${data.orderNumber || ''}】至吧台取餐！`;
          if (!notifiedCompleted) {
            notifiedCompleted = true;
            playPickupReadyChime();
          }
        } else if (data.status === 'accepted') {
          badge.className = "bg-blue-600 text-white text-xs font-extrabold px-3 py-1 rounded-full";
          badge.innerText = "🔥 吧台已接單製作中";
          text.innerText = `吧台已接收您的 ${data.orderNumber || ''} 訂單（${data.pickupTime || '立即製作'}），正在為您現磨萃取中！`;
        } else {
          badge.className = "bg-amber-100 text-amber-800 text-xs font-extrabold px-3 py-1 rounded-full";
          badge.innerText = "⏳ 等待吧台確認接單";
          text.innerText = `已送出 ${data.orderNumber || ''} 訂單（共 NT$${data.totalAmount}），等待吧台人員確認中。`;
        }
      });
    }

    // 產生今日流水取餐號碼 (#001, #002...)
    async function generateTodayOrderNumber() {
      try {
        const snap = await getDocs(collection(db, "orders"));
        const todayStr = new Date().toLocaleDateString('zh-TW');
        let count = 0;
        snap.forEach(d => {
          const dt = d.data().createdAt?.toDate ? d.data().createdAt.toDate() : new Date();
          if (dt.toLocaleDateString('zh-TW') === todayStr) count++;
        });
        return `#${String(count + 1).padStart(3, '0')}`;
      } catch (e) {
        return `#${String(Math.floor(100 + Math.random() * 900))}`;
      }
    }

    window.submitOrder = async function() {
      applyStoreStatusUI();
      if (!isStoreCurrentlyOpen) {
        alert(`抱歉，${storeCloseReason}，目前僅供瀏覽菜單，無法送出訂單喔！`);
        closeCart();
        return;
      }

      const customerName = document.getElementById('customer-name').value.trim();
      const customerPhone = document.getElementById('customer-phone').value.trim();
      
      if (!customerName || !customerPhone) { 
        alert('請填寫取餐人姓名與連絡電話！'); 
        closeCart();
        document.getElementById('customer-name').focus();
        return; 
      }
      if (cart.length === 0) { 
        alert('購物車是空的喔！'); 
        return; 
      }

      let finalPickupTime = pickupMode;
      if (pickupMode === 'custom') {
        const customVal = document.getElementById('custom-pickup-time').value;
        if (!customVal) {
          alert('請選擇您的指定取餐時間！');
          closeCart();
          return;
        }
        finalPickupTime = `指定 ${customVal} 取餐`;
      }

      // 解鎖客人手機音效以便完成時響鈴
      try {
        if (!customerAudioCtx) customerAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (customerAudioCtx.state === 'suspended') customerAudioCtx.resume();
      } catch (e) {}

      localStorage.setItem('noday_name', customerName);
      localStorage.setItem('noday_phone', customerPhone);
      localStorage.setItem('noday_last_order', JSON.stringify(cart));
      loadLastOrderHistory();

      const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const customerInfo = `${customerName} (${customerPhone})`;
      const orderNumber = await generateTodayOrderNumber();

      try {
        const docRef = await addDoc(collection(db, "orders"), {
          orderNumber: orderNumber,
          orderType: "外帶自取",
          pickupTime: finalPickupTime,
          customerName: customerName,
          customerPhone: customerPhone,
          customerInfo: customerInfo,
          items: cart,
          totalAmount: totalAmount,
          status: "pending",
          createdAt: serverTimestamp()
        });
        cart = [];
        updateCartBadge();
        closeCart();
        watchOrderStatus(docRef.id);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        showToast(`🎉 訂單已送出！您的取餐號碼為 ${orderNumber}`);
      } catch (e) { console.error(e); alert("送出失敗，請重試"); }
    };

    loadMenu();
  </script>
</body>
</html>
