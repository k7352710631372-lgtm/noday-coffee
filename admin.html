<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NODAY Coffee Roasters | 吧台接單與管理後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20">

  <!-- 頂部導覽列 -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-30 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <h1 class="text-base font-extrabold tracking-wide">☕ NODAY 吧台管理後台</h1>
        <span id="system-clock" class="text-xs font-mono text-slate-400 bg-slate-900 px-2.5 py-1 rounded-lg">--:--:--</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleVoiceAlert(this)" id="voice-toggle-btn" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-xl text-xs font-bold transition">
          🔊 語音播報：已關閉 (點擊開啟)
        </button>
        <button onclick="togglePauseStore()" id="pause-store-btn" class="bg-amber-600 hover:bg-amber-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-extrabold shadow transition">
          ⏸️ 暫停接單 15分
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 space-y-6">

    <!-- 標籤頁切換 -->
    <div class="flex gap-2 border-b border-slate-800 pb-2">
      <button onclick="switchTab('orders')" id="tab-btn-orders" class="px-4 py-2 rounded-xl text-xs font-extrabold bg-[#213c64] text-white shadow">
        📦 即時訂單看板 <span id="pending-count-badge" class="bg-red-500 text-white px-1.5 py-0.5 rounded-full text-[10px] ml-1">0</span>
      </button>
      <button onclick="switchTab('menu')" id="tab-btn-menu" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300">
        📋 雲端菜單管理
      </button>
      <button onclick="switchTab('settings')" id="tab-btn-settings" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300">
        ⚙️ 營業時間與行銷設定
      </button>
    </div>

    <!-- 1. 即時訂單看板 -->
    <section id="tab-orders" class="space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-extrabold text-slate-200">🔥 即時外帶訂單串流（自動同步）</h2>
        <div class="flex gap-2 text-xs">
          <button onclick="filterOrders('all')" id="filter-all" class="px-3 py-1 rounded-lg bg-slate-800 font-bold border border-slate-700">全部</button>
          <button onclick="filterOrders('pending')" id="filter-pending" class="px-3 py-1 rounded-lg bg-red-950/60 text-red-300 font-bold border border-red-800/60">待接單</button>
          <button onclick="filterOrders('active')" id="filter-active" class="px-3 py-1 rounded-lg bg-blue-950/60 text-blue-300 font-bold border border-blue-800/60">製作中</button>
        </div>
      </div>
      <div id="orders-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <p class="text-slate-500 text-xs col-span-2 py-10 text-center">正在載入雲端訂單...</p>
      </div>
    </section>

    <!-- 2. 雲端菜單管理 -->
    <section id="tab-menu" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-extrabold text-slate-200">📋 飲品與加購項目管理</h2>
        <button onclick="addNewCategoryModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-extrabold shadow">
          ＋ 新增分類
        </button>
      </div>
      <div id="admin-menu-container" class="space-y-4"></div>
    </section>

    <!-- 3. 營業時間與行銷設定 -->
    <section id="tab-settings" class="hidden space-y-4 max-w-2xl">
      <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-4 shadow-lg">
        <h2 class="text-sm font-extrabold text-slate-200 border-b border-slate-700 pb-2">🕒 營業狀態與每週時間</h2>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-bold text-slate-400 block mb-1">營業模式切換</label>
            <select id="set-store-mode" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs font-bold">
              <option value="auto">自動依時段營業</option>
              <option value="open">強制持續營業（手動開店）</option>
              <option value="closed">強制打烊休息（暫停接單）</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-bold text-slate-400 block mb-1">店休公告標題</label>
            <input type="text" id="set-ann-title" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs font-bold" placeholder="例如：外帶取餐提醒">
          </div>
        </div>
        <div>
          <label class="text-xs font-bold text-slate-400 block mb-1">公告內文</label>
          <textarea id="set-ann-text" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs font-bold" placeholder="公告內容..."></textarea>
        </div>
        <button onclick="saveStoreSettings()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-xs font-extrabold shadow">
          儲存營業設定
        </button>
      </div>

      <!-- 優惠碼管理區 -->
      <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-4 shadow-lg">
        <div class="flex justify-between items-center border-b border-slate-700 pb-2">
          <h2 class="text-sm font-extrabold text-slate-200">🎟️ 優惠碼折扣管理</h2>
          <button onclick="addPromoCodeRow()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-xl text-xs font-extrabold">＋ 新增優惠碼</button>
        </div>
        <div id="promo-codes-list" class="space-y-3"></div>
        <button onclick="savePromoCodes()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-xs font-extrabold shadow">
          儲存優惠碼設定
        </button>
      </div>
    </section>
  </main>

  <!-- 隱藏的列印標籤專用區 -->
  <div id="print-area" class="hidden"></div>

  <!-- 訊息回傳彈跳視窗 -->
  <div id="reply-modal" class="fixed inset-0 bg-black/70 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-slate-800 w-full max-w-sm rounded-2xl p-5 space-y-4 border border-slate-700 shadow-2xl">
      <h3 class="font-extrabold text-sm text-slate-200">💬 傳送通知給客人</h3>
      <input type="hidden" id="reply-order-id">
      <div class="space-y-2 text-xs">
        <button type="button" onclick="setReplyPreset('目前訂單較多，製作時間將順延 10 分鐘，請見諒！')" class="w-full text-left bg-slate-900 hover:bg-slate-700 p-2.5 rounded-xl border border-slate-700 font-bold">⏱️ 訂單較多將順延 10 分鐘</button>
        <button type="button" onclick="setReplyPreset('您點的手沖豆剛好售完，請電洽吧台換購其他品項！')" class="w-full text-left bg-slate-900 hover:bg-slate-700 p-2.5 rounded-xl border border-slate-700 font-bold">☕ 手沖豆售完請換購</button>
      </div>
      <div>
        <label class="text-[11px] font-bold text-slate-400 block mb-1">自訂回覆內容</label>
        <textarea id="reply-custom-text" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-200 font-bold" placeholder="輸入要傳送給客人的訊息..."></textarea>
      </div>
      <div class="flex gap-2 pt-1">
        <button onclick="closeReplyModal()" class="flex-1 bg-slate-700 text-slate-300 py-2.5 rounded-xl font-extrabold text-xs">取消</button>
        <button onclick="sendReplyToCustomer()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl font-extrabold text-xs shadow">發送通知</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, setDoc, addDoc, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBMdycidtvbE7JmQtvXn-lCqUwod5RxR44",
      authDomain: "noday-coffee.firebaseapp.com",
      projectId: "noday-coffee",
      storageBucket: "noday-coffee.firebasestorage.app",
      messagingSenderId: "1001674084827",
      appId: "1:1001674084827:web:18b47455008c89e70b97fe"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allOrders = [];
    let currentFilter = 'all';
    let latestStoreSettings = {};
    let isVoiceEnabled = false;
    let lastSpokenOrderId = null;
    let audioCtx = null;

    setInterval(() => {
      const now = new Date();
      document.getElementById('system-clock').innerText = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    }, 1000);

    window.toggleVoiceAlert = function(btn) {
      isVoiceEnabled = !isVoiceEnabled;
      if (isVoiceEnabled) {
        btn.className = "bg-emerald-600 text-white px-3 py-1.5 rounded-xl text-xs font-extrabold shadow transition";
        btn.innerText = "🔊 語音播報：已開啟";
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        speakText("語音播報已啟動");
      } else {
        btn.className = "bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-xl text-xs font-bold transition";
        btn.innerText = "🔊 語音播報：已關閉 (點擊開啟)";
      }
    };

    function speakText(text) {
      if (!isVoiceEnabled) return;
      try {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      } catch (e) {}
    }

    function playNewOrderChime() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        [659.25, 830.61, 987.77].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now + idx * 0.18);
          gain.gain.setValueAtTime(0.5, now + idx * 0.18);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.18 + 0.4);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.18);
          osc.stop(now + idx * 0.18 + 0.4);
        });
      } catch (e) {}
    }

    window.togglePauseStore = async function() {
      const pauseUntil = Date.now() + 15 * 60 * 1000;
      await setDoc(doc(db, "settings", "store"), { pauseUntil: pauseUntil }, { merge: true });
      alert("⏸️ 已啟動「暫停接單 15 分鐘」，客人端將顯示吧台忙碌中！");
    };

    window.switchTab = function(tabName) {
      ['orders', 'menu', 'settings'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== tabName);
        const btn = document.getElementById(`tab-btn-${t}`);
        if (t === tabName) {
          btn.className = "px-4 py-2 rounded-xl text-xs font-extrabold bg-[#213c64] text-white shadow";
        } else {
          btn.className = "px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300";
        }
      });
      if (tabName === 'menu') loadAdminMenu();
    };

    window.filterOrders = function(status) {
      currentFilter = status;
      ['all', 'pending', 'active'].forEach(s => {
        const btn = document.getElementById(`filter-${s}`);
        btn.className = s === status ? "px-3 py-1 rounded-lg bg-slate-700 font-extrabold border border-slate-600 text-white" : "px-3 py-1 rounded-lg bg-slate-800 font-bold border border-slate-700 text-slate-400";
      });
      renderOrders();
    };

    // 監聽即時訂單
    const qOrders = query(collection(db, "orders"), orderBy("createdAt", "desc"));
    onSnapshot(qOrders, (snapshot) => {
      let pendingCount = 0;
      let hasNewPending = false;
      let newestPendingId = null;
      let newestPendingText = "";

      allOrders = [];
      snapshot.forEach(d => {
        const data = { id: d.id, ...d.data() };
        allOrders.push(data);
        if (data.status === 'pending') {
          pendingCount++;
          if (!hasNewPending) {
            hasNewPending = true;
            newestPendingId = data.id;
            const cupSum = (data.items || []).reduce((s, i) => s + i.qty, 0);
            newestPendingText = `新訂單，${data.customerName}，共 ${cupSum} 杯，${data.pickupTime}`;
          }
        }
      });

      document.getElementById('pending-count-badge').innerText = pendingCount;
      renderOrders();

      if (hasNewPending && newestPendingId !== lastSpokenOrderId) {
        lastSpokenOrderId = newestPendingId;
        playNewOrderChime();
        speakText(newestPendingText);
      }
    });

    function renderOrders() {
      const container = document.getElementById('orders-container');
      let list = allOrders;
      if (currentFilter === 'pending') {
        list = allOrders.filter(o => o.status === 'pending');
      } else if (currentFilter === 'active') {
        list = allOrders.filter(o => o.status === 'accepted');
      }

      if (list.length === 0) {
        container.innerHTML = `<p class="text-slate-500 text-xs col-span-2 py-10 text-center">目前沒有符合條件的訂單...</p>`;
        return;
      }

      container.innerHTML = list.map(o => {
        const isPending = o.status === 'pending';
        const isAccepted = o.status === 'accepted';
        const isCompleted = o.status === 'completed';

        let badgeHtml = `<span class="bg-red-950 text-red-400 border border-red-800 px-2.5 py-1 rounded-full text-xs font-extrabold">⏳ 待接單</span>`;
        if (isAccepted) badgeHtml = `<span class="bg-blue-950 text-blue-300 border border-blue-800 px-2.5 py-1 rounded-full text-xs font-extrabold">🔥 製作中</span>`;
        if (isCompleted) badgeHtml = `<span class="bg-emerald-950 text-emerald-300 border border-emerald-800 px-2.5 py-1 rounded-full text-xs font-extrabold">🎉 已完成取餐</span>`;

        const itemsHtml = (o.items || []).map((i, idx) => `
          <div class="flex justify-between items-center text-xs py-1 border-b border-slate-700/60">
            <div>
              <span class="font-extrabold text-amber-300">${i.qty}x</span> 
              <span class="font-bold text-slate-100">${i.name}</span>
              ${i.cupLabel ? `<span class="bg-blue-900/80 text-blue-200 px-1.5 py-0.5 rounded text-[10px] font-extrabold ml-1">🏷️ ${i.cupLabel}</span>` : ''}
              <p class="text-[10px] text-slate-400 mt-0.5">${(i.modifiers || []).join(' / ')} ${i.note ? `[備註: ${i.note}]` : ''}</p>
            </div>
            <span class="font-mono font-bold text-slate-300">NT$${i.price * i.qty}</span>
          </div>
        `).join('');

        return `
          <div class="bg-slate-800 border ${isPending ? 'border-red-500/80 shadow-red-950/50 shadow-lg' : 'border-slate-700'} rounded-2xl p-4 space-y-3">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
              <div class="flex items-center gap-2">
                <span class="bg-[#213c64] text-white font-extrabold text-sm px-3 py-1 rounded-xl">${o.orderNumber || '#001'}</span>
                <div>
                  <p class="text-xs font-extrabold text-slate-200">${o.customerInfo}</p>
                  <p class="text-[10px] text-amber-400 font-bold">⏰ ${o.pickupTime} ${o.taxId ? `| 🧾統編:${o.taxId}` : ''}</p>
                </div>
              </div>
              ${badgeHtml}
            </div>

            <div class="space-y-1">${itemsHtml}</div>

            <div class="flex justify-between items-center pt-1 text-xs font-extrabold text-slate-300">
              <span>總金額：<span class="text-amber-400 text-sm">NT$${o.totalAmount}</span></span>
              <span class="text-[10px] text-slate-400 font-mono">${o.createdAt?.toDate ? o.createdAt.toDate().toLocaleTimeString() : '剛剛'}</span>
            </div>

            <!-- 操作按鈕列 -->
            <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-700">
              <button onclick="printOrderCupLabels('${o.id}')" class="bg-slate-700 hover:bg-slate-600 text-slate-200 py-2 rounded-xl text-xs font-extrabold shadow">
                🨨 列印杯貼
              </button>
              <button onclick="openReplyModal('${o.id}')" class="bg-indigo-900/60 hover:bg-indigo-900 text-indigo-200 border border-indigo-700/60 py-2 rounded-xl text-xs font-extrabold shadow">
                💬 傳送通知
              </button>
              ${isPending ? `
                <button onclick="updateOrderStatus('${o.id}', 'accepted')" class="bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl text-xs font-extrabold shadow col-span-3">
                  🔥 接受訂單並開始製作
                </button>
              ` : isAccepted ? `
                <button onclick="updateOrderStatus('${o.id}', 'completed')" class="bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl text-xs font-extrabold shadow col-span-3">
                  🎉 製作完成・通知客人取餐
                </button>
              ` : `
                <button onclick="updateOrderStatus('${o.id}', 'pending')" class="bg-slate-700 text-slate-300 py-2 rounded-xl text-xs font-bold col-span-3">
                  🔄 重新設為待接單
                </button>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    window.updateOrderStatus = async function(orderId, newStatus) {
      try {
        await updateDoc(doc(db, "orders", orderId), { status: newStatus });
      } catch (e) {
        alert("更新狀態失敗");
      }
    };

    // 🖨️ 列印杯貼（自動將訂單展開為每杯一張熱感應標籤）
    window.printOrderCupLabels = function(orderId) {
      const order = allOrders.find(o => o.id === orderId);
      if (!order) return;
      const printArea = document.getElementById('print-area');
      let cupsHtml = '';
      let totalCups = (order.items || []).reduce((s, i) => s + i.qty, 0);
      let cupCounter = 1;

      (order.items || []).forEach(item => {
        for (let q = 0; q < item.qty; q++) {
          cupsHtml += `
            <div style="width: 50mm; min-height: 35mm; padding: 3mm; margin-bottom: 5mm; font-family: monospace; border: 1px dashed #000; page-break-after: always; box-sizing: border-box; background: #fff; color: #000;">
              <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; border-bottom: 1px solid #000; padding-bottom: 2mm; margin-bottom: 2mm;">
                <span>${order.orderNumber}</span>
                <span>(${cupCounter}/${totalCups})</span>
              </div>
              <div style="font-size: 16px; font-weight: 900; margin-bottom: 1mm;">${item.name}</div>
              ${item.cupLabel ? `<div style="font-size: 14px; font-weight: bold; background: #000; color: #fff; padding: 1px 4px; display: inline-block; margin-bottom: 1mm;">🏷️ 姓名: ${item.cupLabel}</div>` : ''}
              <div style="font-size: 12px; font-weight: bold; margin-bottom: 1mm;">${(item.modifiers || []).join(' / ')}</div>
              ${item.note ? `<div style="font-size: 11px; font-weight: bold;">備註: ${item.note}</div>` : ''}
              <div style="font-size: 10px; margin-top: 2mm; border-top: 1px dashed #666; padding-top: 1mm; display: flex; justify-content: space-between;">
                <span>取: ${order.pickupTime}</span>
                <span>${order.customerName}</span>
              </div>
              ${order.taxId ? `<div style="font-size: 10px;">統編: ${order.taxId}</div>` : ''}
            </div>
          `;
          cupCounter++;
        }
      });

      printArea.innerHTML = cupsHtml;
      printArea.classList.remove('hidden');
      window.print();
      setTimeout(() => { printArea.classList.add('hidden'); }, 1000);
    };

    window.openReplyModal = function(orderId) {
      document.getElementById('reply-order-id').value = orderId;
      document.getElementById('reply-custom-text').value = '';
      document.getElementById('reply-modal').classList.remove('hidden');
    };
    window.closeReplyModal = function() {
      document.getElementById('reply-modal').classList.add('hidden');
    };
    window.setReplyPreset = function(txt) {
      document.getElementById('reply-custom-text').value = txt;
    };
    window.sendReplyToCustomer = async function() {
      const orderId = document.getElementById('reply-order-id').value;
      const text = document.getElementById('reply-custom-text').value.trim();
      if (!text) { alert('請輸入或選擇通知訊息！'); return; }
      try {
        await updateDoc(doc(db, "orders", orderId), { baristaMessage: text });
        closeReplyModal();
        alert("✅ 已成功傳送通知給客人！");
      } catch (e) {
        alert("發送失敗");
      }
    };

    // 營業設定儲存
    window.saveStoreSettings = async function() {
      const storeMode = document.getElementById('set-store-mode').value;
      const announcementTitle = document.getElementById('set-ann-title').value.trim();
      const announcementText = document.getElementById('set-ann-text').value.trim();
      try {
        await setDoc(doc(db, "settings", "store"), { storeMode, announcementTitle, announcementText }, { merge: true });
        alert("✅ 營業設定儲存成功！");
      } catch (e) {
        alert("儲存失敗");
      }
    };

    onSnapshot(doc(db, "settings", "store"), (snap) => {
      if (snap.exists()) {
        latestStoreSettings = snap.data();
        if (latestStoreSettings.storeMode) document.getElementById('set-store-mode').value = latestStoreSettings.storeMode;
        if (latestStoreSettings.announcementTitle) document.getElementById('set-ann-title').value = latestStoreSettings.announcementTitle;
        if (latestStoreSettings.announcementText) document.getElementById('set-ann-text').value = latestStoreSettings.announcementText;
        renderPromoCodesList(latestStoreSettings.promoCodes || []);
      }
    });

    function renderPromoCodesList(promos) {
      const container = document.getElementById('promo-codes-list');
      if (promos.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500">目前沒有設定優惠碼，點擊上方按鈕新增。</p>`;
        return;
      }
      container.innerHTML = promos.map((p, idx) => `
        <div class="grid grid-cols-4 gap-2 bg-slate-900 p-2.5 rounded-xl border border-slate-700 text-xs items-center promo-row">
          <input type="text" value="${p.code}" placeholder="代碼(例:NODAY88)" class="bg-slate-800 border border-slate-700 rounded-lg p-1.5 font-extrabold uppercase promo-code-val">
          <select class="bg-slate-800 border border-slate-700 rounded-lg p-1.5 font-bold promo-type-val">
            <option value="percent" ${p.type==='percent'?'selected':''}>打折(%)</option>
            <option value="fixed" ${p.type==='fixed'?'selected':''}>折現($)</option>
          </select>
          <input type="number" value="${p.value}" placeholder="數值(例:90或30)" class="bg-slate-800 border border-slate-700 rounded-lg p-1.5 font-bold promo-val-val">
          <div class="flex gap-1">
            <input type="number" value="${p.minSpend || 0}" placeholder="低消" class="bg-slate-800 border border-slate-700 rounded-lg p-1.5 font-bold w-16 promo-min-val">
            <button type="button" onclick="this.closest('.promo-row').remove()" class="bg-red-900/60 text-red-300 px-2.5 py-1 rounded-lg font-extrabold">✕</button>
          </div>
        </div>
      `).join('');
    }

    window.addPromoCodeRow = function() {
      const container = document.getElementById('promo-codes-list');
      const div = document.createElement('div');
      div.className = "grid grid-cols-4 gap-2 bg-slate-900 p-2.5 rounded-xl border border-slate-700 text-xs items-center promo-row";
      div.innerHTML = `
        <input type="text" placeholder="代碼(例:NODAY88)" class="bg-slate-800 border border-slate-700 rounded-lg p-1.5 font-extrabold uppercase promo-code-val">
        <select class="bg-slate-800 border border-slate-700 rounded-lg p-1.5 font-bold promo-type-val">
          <option value="percent">打折(%)</option>
          <option value="fixed" selected>折現($)</option>
        </select>
        <input type="number" placeholder="數值" class="bg-slate-800 border border-slate-700 rounded-lg p-1.5 font-bold promo-val-val">
        <div class="flex gap-1">
          <input type="number" value="0" placeholder="低消" class="bg-slate-800 border border-slate-700 rounded-lg p-1.5 font-bold w-16 promo-min-val">
          <button type="button" onclick="this.closest('.promo-row').remove()" class="bg-red-900/60 text-red-300 px-2.5 py-1 rounded-lg font-extrabold">✕</button>
        </div>
      `;
      container.appendChild(div);
    };

    window.savePromoCodes = async function() {
      const rows = document.querySelectorAll('.promo-row');
      const promoCodes = [];
      rows.forEach(r => {
        const code = r.querySelector('.promo-code-val').value.trim();
        const type = r.querySelector('.promo-type-val').value;
        const value = Number(r.querySelector('.promo-val-val').value);
        const minSpend = Number(r.querySelector('.promo-min-val').value);
        if (code) promoCodes.push({ code, type, value, minSpend, enabled: true });
      });
      try {
        await setDoc(doc(db, "settings", "store"), { promoCodes: promoCodes }, { merge: true });
        alert("✅ 優惠碼設定已成功儲存！");
      } catch (e) {
        alert("儲存失敗");
      }
    };

    // 雲端菜單管理簡化讀取
    async function loadAdminMenu() {
      const container = document.getElementById('admin-menu-container');
      const snap = await getDocs(collection(db, "menu"));
      if (snap.empty) { container.innerHTML = `<p class="text-xs text-slate-500">尚無菜單資料</p>`; return; }
      let html = '';
      snap.forEach(d => {
        const cat = d.data();
        html += `
          <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
            <h3 class="font-extrabold text-sm text-slate-200 border-b border-slate-700 pb-1.5">${cat.category}</h3>
            <div class="space-y-2">
              ${(cat.items || []).map((item, idx) => `
                <div class="flex justify-between items-center bg-slate-900 p-2.5 rounded-xl border border-slate-700 text-xs">
                  <div>
                    <span class="font-extrabold text-slate-100">${item.name}</span>
                    <span class="font-bold text-amber-400 ml-2">NT$${item.price}</span>
                    ${item.isUpsell ? `<span class="bg-amber-950 text-amber-300 px-1.5 py-0.5 rounded text-[10px] font-extrabold ml-2">🛍️ 加購推薦</span>` : ''}
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="${item.soldOut ? 'text-red-400' : 'text-emerald-400'} font-bold">${item.soldOut ? '已售完'供應中'}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }
  </script>
</body>
</html>
