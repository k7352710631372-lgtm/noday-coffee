<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NODAY Coffee Roasters | 吧台接單與後台管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-16">

  <!-- 頂部導覽列 -->
  <header class="bg-[#213c64] text-white p-4 shadow-md sticky top-0 z-30">
    <div class="max-w-5xl mx-auto flex flex-wrap justify-between items-center gap-3">
      <div>
        <h1 class="text-xl font-extrabold flex items-center gap-2">☕ NODAY 吧台管理系統</h1>
        <p class="text-xs text-gray-200 mt-0.5">外帶即時接單看板 ＆ 全品項獨立加價管理</p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="toggleSound()" id="sound-btn" class="bg-white/15 hover:bg-white/25 text-white px-3 py-2 rounded-xl text-xs font-bold transition">
          🔔 提示音：開啟
        </button>
        <button onclick="openItemModal('add')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow transition">
          ＋ 新增品項
        </button>
        <button onclick="initMenuToFirebase()" class="bg-amber-600 hover:bg-amber-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow transition">
          ⚡ 還原預設菜單
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 space-y-6 mt-2">
    <!-- 營運數據小看板 -->
    <section class="grid grid-cols-3 gap-3">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-amber-200">
        <p class="text-xs text-gray-500 font-bold">⏳ 待製作訂單</p>
        <p id="stat-pending" class="text-2xl font-extrabold text-amber-600 mt-1">0 筆</p>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-emerald-200">
        <p class="text-xs text-gray-500 font-bold">✅ 今日已完成</p>
        <p id="stat-completed" class="text-2xl font-extrabold text-emerald-600 mt-1">0 筆</p>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-blue-200">
        <p class="text-xs text-gray-500 font-bold">💰 今日累計營收</p>
        <p id="stat-revenue" class="text-2xl font-extrabold text-[#213c64] mt-1">NT$0</p>
      </div>
    </section>

    <!-- 即時接單區 -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-extrabold text-gray-900 flex items-center gap-2">
          <span>🔔 即時外帶訂單看板</span>
          <span class="text-xs bg-red-100 text-red-600 px-2.5 py-0.5 rounded-full font-bold animate-pulse">即時連線中</span>
        </h2>
        <button onclick="toggleHistory()" id="history-toggle-btn" class="text-xs text-[#213c64] font-bold hover:underline">
          查看今日已完成訂單 ▾
        </button>
      </div>

      <div id="orders-container" class="space-y-3">
        <p class="text-gray-400 text-sm py-6 text-center">目前沒有待處理的新訂單...</p>
      </div>

      <!-- 已完成歷史訂單區 -->
      <div id="completed-orders-section" class="hidden mt-6 pt-4 border-t">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-xs font-extrabold text-gray-500">📋 今日已完成訂單紀錄</h3>
        </div>
        <div id="completed-orders-container" class="space-y-2 max-h-60 overflow-y-auto"></div>
      </div>
    </section>

    <!-- 菜單管理區 -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
        <div>
          <h2 class="text-base font-extrabold text-gray-900">🛠️ 雲端菜單與細項加價設定</h2>
          <p class="text-xs text-gray-500 mt-0.5">點擊任一飲品的「修改」，即可單獨勾選溫度、配方豆、甜度與「加購區」並調整價錢。</p>
        </div>
      </div>
      <div id="admin-menu-list" class="space-y-5">
        <p class="text-gray-400 text-sm">正在載入雲端菜單...</p>
      </div>
    </section>
  </main>

  <!-- 新增/修改品項 共用 Modal -->
  <div id="item-modal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-3 sm:p-4">
    <div class="bg-white w-full max-w-lg rounded-2xl p-5 sm:p-6 space-y-4 max-h-[92vh] overflow-y-auto shadow-2xl">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="modal-title" class="text-lg font-extrabold text-gray-900">修改品項與加購設定</h3>
        <button onclick="closeItemModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg px-2">✕</button>
      </div>

      <input type="hidden" id="modal-mode" value="edit">
      <input type="hidden" id="edit-item-id">

      <!-- 分類選擇 -->
      <div>
        <label class="text-xs font-bold text-gray-600">所屬分類</label>
        <select id="edit-cat-name" class="w-full border rounded-xl p-2.5 text-sm mt-1 bg-white focus:outline-none focus:border-[#213c64]">
          <option value="美式系列 Americano">美式系列 Americano</option>
          <option value="單品手沖 PourOver">單品手沖 PourOver</option>
          <option value="拿鐵系列 Cafe Latte">拿鐵系列 Cafe Latte</option>
          <option value="風味飲品 Beverage">風味飲品 Beverage</option>
          <option value="NODAY 周邊">NODAY 周邊</option>
          <option value="微氣泡 Fizzy">微氣泡 Fizzy</option>
          <option value="季節限定 ＮＥＷ">季節限定 ＮＥＷ</option>
        </select>
      </div>

      <!-- 名稱與價格 -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-bold text-gray-600">品項名稱</label>
          <input type="text" id="edit-name" placeholder="例如：美式咖啡" class="w-full border rounded-xl p-2.5 text-sm mt-1 focus:outline-none focus:border-[#213c64]">
        </div>
        <div>
          <label class="text-xs font-bold text-gray-600">基本價格 (NT$)</label>
          <input type="number" id="edit-price" placeholder="80" class="w-full border rounded-xl p-2.5 text-sm mt-1 focus:outline-none focus:border-[#213c64]">
        </div>
      </div>

      <div>
        <label class="text-xs font-bold text-gray-600">品項描述 (容量/風味說明)</label>
        <input type="text" id="edit-desc" placeholder="16oz｜風味說明" class="w-full border rounded-xl p-2.5 text-sm mt-1 focus:outline-none focus:border-[#213c64]">
      </div>

      <!-- 1. 飲品溫度設定 -->
      <div class="border rounded-xl p-3.5 bg-gray-50 space-y-2">
        <label class="text-xs font-extrabold text-[#213c64] block">🌡️ 飲品溫度設定：</label>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <label class="flex items-center gap-2 bg-white p-2.5 rounded-lg border cursor-pointer shadow-sm">
            <input type="checkbox" id="opt-ice" class="w-4 h-4 accent-[#213c64]">
            <span class="font-bold">提供「冰」選項</span>
          </label>
          <label class="flex items-center gap-2 bg-white p-2.5 rounded-lg border cursor-pointer shadow-sm">
            <input type="checkbox" id="opt-hot" class="w-4 h-4 accent-[#213c64]">
            <span class="font-bold">提供「熱」選項</span>
          </label>
        </div>
      </div>

      <!-- 2. 配方豆設定 -->
      <div class="border rounded-xl p-3.5 bg-gray-50 space-y-2">
        <label class="text-xs font-extrabold text-[#213c64] block">🫘 配方豆設定（可單獨打勾與調整價錢）：</label>
        <div class="space-y-2 text-xs">
          <div class="flex items-center justify-between bg-white p-2.5 rounded-lg border shadow-sm">
            <label class="flex items-center gap-2 cursor-pointer font-bold">
              <input type="checkbox" id="opt-bean5" class="w-4 h-4 accent-[#213c64]"> 5號配方豆 (經典)
            </label>
            <div class="flex items-center gap-1">
              <span class="text-[11px] text-gray-500">加價 NT$</span>
              <input type="number" id="price-bean5" class="w-16 border rounded-lg p-1 text-xs text-center font-bold" value="0">
            </div>
          </div>
          <div class="flex items-center justify-between bg-white p-2.5 rounded-lg border shadow-sm">
            <label class="flex items-center gap-2 cursor-pointer font-bold">
              <input type="checkbox" id="opt-bean1" class="w-4 h-4 accent-[#213c64]"> 1號配方豆 (果香)
            </label>
            <div class="flex items-center gap-1">
              <span class="text-[11px] text-gray-500">加價 NT$</span>
              <input type="number" id="price-bean1" class="w-16 border rounded-lg p-1 text-xs text-center font-bold" value="0">
            </div>
          </div>
        </div>
      </div>

      <!-- 3. 甜度選項與加價設定 -->
      <div class="border rounded-xl p-3.5 bg-gray-50 space-y-2">
        <label class="text-xs font-extrabold text-[#213c64] block">🍯 甜度選項設定（可單獨打勾與調整價錢）：</label>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
          <div class="flex items-center justify-between bg-white p-2.5 rounded-lg border shadow-sm">
            <label class="flex items-center gap-2 cursor-pointer font-bold"><input type="checkbox" id="opt-sugar-free" class="w-4 h-4 accent-[#213c64]"> 無糖</label>
            <div class="flex items-center gap-1"><span class="text-[11px] text-gray-500">+$</span><input type="number" id="price-sugar-free" class="w-14 border rounded-lg p-1 text-xs text-center font-bold" value="0"></div>
          </div>
          <div class="flex items-center justify-between bg-white p-2.5 rounded-lg border shadow-sm">
            <label class="flex items-center gap-2 cursor-pointer font-bold"><input type="checkbox" id="opt-sugar-micro" class="w-4 h-4 accent-[#213c64]"> 微糖</label>
            <div class="flex items-center gap-1"><span class="text-[11px] text-gray-500">+$</span><input type="number" id="price-sugar-micro" class="w-14 border rounded-lg p-1 text-xs text-center font-bold" value="0"></div>
          </div>
          <div class="flex items-center justify-between bg-white p-2.5 rounded-lg border shadow-sm">
            <label class="flex items-center gap-2 cursor-pointer font-bold"><input type="checkbox" id="opt-sugar-half" class="w-4 h-4 accent-[#213c64]"> 半糖</label>
            <div class="flex items-center gap-1"><span class="text-[11px] text-gray-500">+$</span><input type="number" id="price-sugar-half" class="w-14 border rounded-lg p-1 text-xs text-center font-bold" value="0"></div>
          </div>
          <div class="flex items-center justify-between bg-white p-2.5 rounded-lg border shadow-sm">
            <label class="flex items-center gap-2 cursor-pointer font-bold"><input type="checkbox" id="opt-sugar-normal" class="w-4 h-4 accent-[#213c64]"> 正常甜</label>
            <div class="flex items-center gap-1"><span class="text-[11px] text-gray-500">+$</span><input type="number" id="price-sugar-normal" class="w-14 border rounded-lg p-1 text-xs text-center font-bold" value="0"></div>
          </div>
        </div>
      </div>

      <!-- 4. 獨立加購區（加一份濃縮、更換燕麥奶、撒粉等，皆可單獨打勾與調整價錢） -->
      <div class="border-2 border-amber-300 rounded-xl p-3.5 bg-amber-50/40 space-y-2.5">
        <div class="flex justify-between items-center">
          <label class="text-xs font-extrabold text-amber-900 block">🎁 加購區設定（可單獨打勾與調整價錢）：</label>
          <button type="button" onclick="addCustomAddonRow('', 0, true)" class="text-[11px] bg-amber-600 hover:bg-amber-700 text-white px-2.5 py-1 rounded-lg font-bold shadow-sm">
            ＋ 新增其他加購項
          </button>
        </div>

        <div class="space-y-2 text-xs">
          <!-- 加一份濃縮 -->
          <div class="flex items-center justify-between bg-white p-2.5 rounded-lg border border-amber-200 shadow-sm">
            <label class="flex items-center gap-2 cursor-pointer font-bold text-gray-800">
              <input type="checkbox" id="opt-addon-shot" class="w-4 h-4 accent-[#213c64]"> 加一份濃縮
            </label>
            <div class="flex items-center gap-1">
              <span class="text-[11px] text-gray-500">加價 NT$</span>
              <input type="number" id="price-addon-shot" class="w-16 border rounded-lg p-1 text-xs text-center font-bold" value="20">
            </div>
          </div>

          <!-- 更換燕麥奶 -->
          <div class="flex items-center justify-between bg-white p-2.5 rounded-lg border border-amber-200 shadow-sm">
            <label class="flex items-center gap-2 cursor-pointer font-bold text-gray-800">
              <input type="checkbox" id="opt-addon-oat" class="w-4 h-4 accent-[#213c64]"> 更換燕麥奶
            </label>
            <div class="flex items-center gap-1">
              <span class="text-[11px] text-gray-500">加價 NT$</span>
              <input type="number" id="price-addon-oat" class="w-16 border rounded-lg p-1 text-xs text-center font-bold" value="25">
            </div>
          </div>

          <!-- 可可粉 -->
          <div class="flex items-center justify-between bg-white p-2.5 rounded-lg border border-amber-200 shadow-sm">
            <label class="flex items-center gap-2 cursor-pointer font-bold text-gray-800">
              <input type="checkbox" id="opt-addon-cocoa" class="w-4 h-4 accent-[#213c64]"> 可可粉
            </label>
            <div class="flex items-center gap-1">
              <span class="text-[11px] text-gray-500">加價 NT$</span>
              <input type="number" id="price-addon-cocoa" class="w-16 border rounded-lg p-1 text-xs text-center font-bold" value="10">
            </div>
          </div>

          <!-- 黑糖粉 -->
          <div class="flex items-center justify-between bg-white p-2.5 rounded-lg border border-amber-200 shadow-sm">
            <label class="flex items-center gap-2 cursor-pointer font-bold text-gray-800">
              <input type="checkbox" id="opt-addon-brownsugar" class="w-4 h-4 accent-[#213c64]"> 黑糖粉
            </label>
            <div class="flex items-center gap-1">
              <span class="text-[11px] text-gray-500">加價 NT$</span>
              <input type="number" id="price-addon-brownsugar" class="w-16 border rounded-lg p-1 text-xs text-center font-bold" value="10">
            </div>
          </div>

          <!-- 肉桂粉 -->
          <div class="flex items-center justify-between bg-white p-2.5 rounded-lg border border-amber-200 shadow-sm">
            <label class="flex items-center gap-2 cursor-pointer font-bold text-gray-800">
              <input type="checkbox" id="opt-addon-cinnamon" class="w-4 h-4 accent-[#213c64]"> 肉桂粉
            </label>
            <div class="flex items-center gap-1">
              <span class="text-[11px] text-gray-500">加價 NT$</span>
              <input type="number" id="price-addon-cinnamon" class="w-16 border rounded-lg p-1 text-xs text-center font-bold" value="10">
            </div>
          </div>

          <!-- 動態新增的自訂加購項容器 -->
          <div id="extra-addons-container" class="space-y-2"></div>
        </div>
      </div>

      <div class="flex gap-3 pt-2">
        <button onclick="closeItemModal()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 py-3 rounded-xl font-bold text-sm transition">取消</button>
        <button onclick="saveItemModal()" class="flex-1 bg-[#213c64] hover:bg-[#192e4d] text-white py-3 rounded-xl font-bold text-sm shadow-md transition">💾 儲存設定</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

    const firebaseConfig = {

      authDomain: "noday-coffee.firebaseapp.com",
      projectId: "noday-coffee",
      storageBucket: "noday-coffee.firebasestorage.app",
      messagingSenderId: "1001674084827",
      appId: "1:1001674084827:web:18b47455008c89e70b97fe"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let cachedCatalog = [];
    let soundEnabled = true;
    let knownPendingIds = new Set();
    let isFirstOrderLoad = true;

    // 音效提醒 (Web Audio API)
    function playNotificationBeep() {
      if (!soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1174.66, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      } catch (e) {}
    }

    window.toggleSound = function() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-btn').innerText = soundEnabled ? '🔔 提示音：開啟' : '🔕 提示音：關閉';
      if (soundEnabled) playNotificationBeep();
    };

    window.toggleHistory = function() {
      const el = document.getElementById('completed-orders-section');
      el.classList.toggle('hidden');
    };

    // 建立預設選項輔助函式
    function buildOpts({
      ice = true, hot = true,
      bean5 = false, priceBean5 = 0, bean1 = false, priceBean1 = 0,
      sugar = false,
      shot = false, priceShot = 20,
      oat = false, priceOat = 25,
      cocoa = false, priceCocoa = 10,
      brownSugar = false, priceBrownSugar = 10,
      cinnamon = false, priceCinnamon = 10
    } = {}) {
      return {
        ice, hot,
        bean5, priceBean5, bean1, priceBean1,
        sugarFree: sugar, priceSugarFree: 0,
        sugarMicro: sugar, priceSugarMicro: 0,
        sugarHalf: sugar, priceSugarHalf: 0,
        sugarNormal: sugar, priceSugarNormal: 0,
        addonShot: shot, priceAddonShot: priceShot,
        addonOat: oat, priceAddonOat: priceOat,
        addonCocoa: cocoa, priceAddonCocoa: priceCocoa,
        addonBrownSugar: brownSugar, priceAddonBrownSugar: priceBrownSugar,
        addonCinnamon: cinnamon, priceAddonCinnamon: priceCinnamon,
        extraAddons: []
      };
    }

    const defaultMenuCatalog = [
      {
        order: 1, category: "美式系列 Americano",
        items: [
          { id: "a1", name: "美式咖啡", price: 80, desc: "16oz｜經典純粹配方", options: buildOpts({ ice: true, hot: true, bean5: true, bean1: true, shot: true }), soldOut: false },
          { id: "a2", name: "香橙美式", price: 90, desc: "16oz｜清爽果香融合濃縮咖啡", options: buildOpts({ ice: true, hot: false, bean5: true, bean1: true, shot: true }), soldOut: false },
          { id: "a3", name: "荔枝美式", price: 90, desc: "16oz", options: buildOpts({ ice: true, hot: false, bean5: true, bean1: true, shot: true }), soldOut: false },
          { id: "a4", name: "黑嘉麗美式", price: 90, desc: "16oz", options: buildOpts({ ice: true, hot: false, bean5: true, bean1: true, shot: true }), soldOut: false },
          { id: "a5", name: "西西里氣泡美式", price: 110, desc: "16oz｜微氣泡清爽檸檬香", options: buildOpts({ ice: true, hot: false, sugar: true, shot: true }), soldOut: false },
          { id: "a6", name: "西西里百香美式", price: 100, desc: "16oz", options: buildOpts({ ice: true, hot: false, sugar: true, shot: true }), soldOut: false }
        ]
      },
      {
        order: 2, category: "單品手沖 PourOver",
        items: [
          { id: "p1", name: "衣索比亞西達馬桃子甜心水洗", price: 130, desc: "中淺培┃水果軟糖、白桃、烏龍茶", options: buildOpts({ ice: true, hot: true }), soldOut: false },
          { id: "p2", name: "中國雲南雲頂莊園荊棘玫瑰日曬", price: 130, desc: "中淺培┃熱帶水果、葡萄、花香尾韻", options: buildOpts({ ice: true, hot: true }), soldOut: false },
          { id: "p3", name: "蘇門答臘華漢納黑珍珠批次濕撥法", price: 130, desc: "中培｜雪松、焦糖、榛果巧可力", options: buildOpts({ ice: true, hot: true }), soldOut: false },
          { id: "p4", name: "衣索比亞耶加雪菲日曬(非洲式烘培)", price: 130, desc: "中深培｜熱帶水果、黑巧克力、甜奶油", options: buildOpts({ ice: true, hot: true }), soldOut: false },

        alert("🎉 預設菜單與獨立加購區已成功寫入雲端！");

    // 取得品項已開啟的加購標籤預覽
    function getAddonBadges(item) {
      const opts = item.options || {};
      const badges = [];
      if (opts.addonShot) badges.push(`加濃縮(+$${opts.priceAddonShot ?? 20})`);
      if (opts.addonOat) badges.push(`換燕麥奶(+$${opts.priceAddonOat ?? 25})`);
      if (opts.addonCocoa) badges.push(`可可粉(+$${opts.priceAddonCocoa ?? 10})`);
      if (opts.addonBrownSugar) badges.push(`黑糖粉(+$${opts.priceAddonBrownSugar ?? 10})`);
      if (opts.addonCinnamon) badges.push(`肉桂粉(+$${opts.priceAddonCinnamon ?? 10})`);
      if (Array.isArray(opts.extraAddons)) {
        opts.extraAddons.forEach(a => {
          if (a.enabled && a.name) badges.push(`${a.name}(+$${a.price || 0})`);
        });
      }
      return badges;
    }

    async function loadAdminMenu() {
      const container = document.getElementById("admin-menu-list");
      try {
        const querySnapshot = await getDocs(collection(db, "menu"));
        if (querySnapshot.empty) {
          container.innerHTML = `<p class="text-amber-600 text-sm">尚無菜單，請點擊右上角「⚡ 還原預設菜單」初始化。</p>`;
          return;
        }
        cachedCatalog = [];
        querySnapshot.forEach(d => cachedCatalog.push(d.data()));
        cachedCatalog.sort((a, b) => a.order - b.order);

        container.innerHTML = cachedCatalog.map(cat => `
          <div class="border rounded-2xl p-4 bg-gray-50">
            <h3 class="font-extrabold text-gray-900 mb-3 text-sm">${cat.category}</h3>
            <div class="space-y-2">
              ${cat.items.map(item => {
                const opts = item.options || {};
                const addonBadges = getAddonBadges(item);
                const hasSugar = opts.sugarFree || opts.sugarMicro || opts.sugarHalf || opts.sugarNormal;
                return `
                  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-3.5 rounded-xl border gap-2 shadow-sm">
                    <div class="space-y-1">
                      <p class="font-extrabold text-sm text-gray-900">
                        ${item.name}
                        <span class="text-xs text-[#213c64] ml-1.5">NT$${item.price}</span>
                      </p>
                      ${item.desc ? `<p class="text-xs text-gray-500">${item.desc}</p>` : ''}
                      <div class="flex flex-wrap gap-1 pt-0.5">
                        <span class="text-[10px] ${opts.ice ? 'bg-blue-50 text-blue-700' : 'bg-gray-100 text-gray-400'} px-1.5 py-0.5 rounded font-bold">${opts.ice ? '冰✓' : '冰✕'}</span>
                        <span class="text-[10px] ${opts.hot ? 'bg-red-50 text-red-700' : 'bg-gray-100 text-gray-400'} px-1.5 py-0.5 rounded font-bold">${opts.hot ? '熱✓' : '熱✕'}</span>
                        ${opts.bean5 ? `<span class="text-[10px] bg-purple-50 text-purple-700 px-1.5 py-0.5 rounded font-bold">5號豆(+$${opts.priceBean5 || 0})</span>` : ''}
                        ${opts.bean1 ? `<span class="text-[10px] bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded font-bold">1號豆(+$${opts.priceBean1 || 0})</span>` : ''}
                        ${hasSugar ? `<span class="text-[10px] bg-amber-50 text-amber-700 px-1.5 py-0.5 rounded font-bold">甜度可調✓</span>` : ''}
                        ${addonBadges.map(b => `<span class="text-[10px] bg-emerald-50 text-emerald-700 px-1.5 py-0.5 rounded font-bold">🎁 ${b}</span>`).join('')}
                      </div>
                    </div>
                    <div class="flex items-center gap-2 self-end sm:self-auto shrink-0">
                      <button onclick="openItemModal('edit', '${cat.category}', '${item.id}')" class="bg-blue-50 hover:bg-blue-100 text-[#213c64] px-3 py-1.5 rounded-lg text-xs font-extrabold">修改 / 加購</button>
                      <button onclick="deleteItem('${cat.category}', '${item.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold">刪除</button>
                      <button onclick="toggleSoldOut('${cat.category}', '${item.id}', ${!item.soldOut})" class="px-3 py-1.5 rounded-lg text-xs font-bold ${item.soldOut ? 'bg-red-500 text-white' : 'bg-gray-100 text-gray-700'}">
                        ${item.soldOut ? '已售完' : '販售中'}
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `).join('');
      } catch (e) { console.error(e); }
    }

    // 動態新增其他自訂加購列
    window.addCustomAddonRow = function(name = '', price = 0, enabled = true) {
      const container = document.getElementById('extra-addons-container');
      const row = document.createElement('div');
      row.className = "flex items-center justify-between bg-white p-2 rounded-lg border border-amber-200 shadow-sm gap-2 extra-addon-row";
      row.innerHTML = `
        <div class="flex items-center gap-2 flex-1">
          <input type="checkbox" class="w-4 h-4 accent-[#213c64] extra-addon-check" ${enabled ? 'checked' : ''}>
          <input type="text" class="border rounded-lg px-2 py-1 text-xs w-full font-bold extra-addon-name" placeholder="輸入加購名稱 (例：加珍珠)" value="${name}">
        </div>
        <div class="flex items-center gap-1 shrink-0">
          <span class="text-[11px] text-gray-500">+$</span>
          <input type="number" class="w-14 border rounded-lg p-1 text-xs text-center font-bold extra-addon-price" value="${price}">
          <button type="button" onclick="this.closest('.extra-addon-row').remove()" class="text-red-500 hover:bg-red-50 px-1.5 py-0.5 rounded font-bold text-xs">✕</button>
        </div>
      `;
      container.appendChild(row);
    };

    window.openItemModal = function(mode, categoryName = '美式系列 Americano', itemId = '') {
      document.getElementById('modal-mode').value = mode;
      document.getElementById('extra-addons-container').innerHTML = '';

      if (mode === 'add') {
        document.getElementById('modal-title').innerText = '＋ 新增品項與加購設定';
        document.getElementById('edit-cat-name').disabled = false;
        document.getElementById('edit-cat-name').value = categoryName;
        document.getElementById('edit-item-id').value = 'item_' + Date.now();
        document.getElementById('edit-name').value = '';
        document.getElementById('edit-price').value = '';
        document.getElementById('edit-desc').value = '';

        document.getElementById('opt-ice').checked = true;
        document.getElementById('opt-hot').checked = true;
        document.getElementById('opt-bean5').checked = true;
        document.getElementById('price-bean5').value = 0;
        document.getElementById('opt-bean1').checked = true;
        document.getElementById('price-bean1').value = 0;

        document.getElementById('opt-sugar-free').checked = false;
        document.getElementById('price-sugar-free').value = 0;
        document.getElementById('opt-sugar-micro').checked = false;
        document.getElementById('price-sugar-micro').value = 0;
        document.getElementById('opt-sugar-half').checked = false;
        document.getElementById('price-sugar-half').value = 0;
        document.getElementById('opt-sugar-normal').checked = false;
        document.getElementById('price-sugar-normal').value = 0;

        document.getElementById('opt-addon-shot').checked = true;
        document.getElementById('price-addon-shot').value = 20;
        document.getElementById('opt-addon-oat').checked = true;
        document.getElementById('price-addon-oat').value = 25;
        document.getElementById('opt-addon-cocoa').checked = false;
        document.getElementById('price-addon-cocoa').value = 10;
        document.getElementById('opt-addon-brownsugar').checked = false;
        document.getElementById('price-addon-brownsugar').value = 10;
        document.getElementById('opt-addon-cinnamon').checked = false;
        document.getElementById('price-addon-cinnamon').value = 10;
      } else {
        document.getElementById('modal-title').innerText = '修改品項與加購設定';
        const cat = cachedCatalog.find(c => c.category === categoryName);
        const targetItem = cat ? cat.items.find(i => i.id === itemId) : null;
        if (!targetItem) return;

        document.getElementById('edit-cat-name').value = categoryName;
        document.getElementById('edit-cat-name').disabled = true;
        document.getElementById('edit-item-id').value = itemId;
        document.getElementById('edit-name').value = targetItem.name;
        document.getElementById('edit-price').value = targetItem.price;
        document.getElementById('edit-desc').value = targetItem.desc || '';

        const opts = targetItem.options || {};

        // 相容舊版 customRules 字串轉換為勾選狀態
        let legacyShot = false, legacyShotPrice = 20;
        let legacyOat = false, legacyOatPrice = 25;
        let legacyCocoa = false, legacyCocoaPrice = 10;
        let legacyBrown = false, legacyBrownPrice = 10;
        let legacyCin = false, legacyCinPrice = 10;

        if (targetItem.customRules && opts.addonShot === undefined) {
          targetItem.customRules.split(',').forEach(r => {
            const [k, v] = r.split(':').map(s => s && s.trim());
            const p = v ? Number(v) : 0;
            if (k === '加一份濃縮') { legacyShot = true; legacyShotPrice = p; }
            else if (k === '更換燕麥奶' || k === '換燕麥奶') { legacyOat = true; legacyOatPrice = p; }
            else if (k === '可可粉') { legacyCocoa = true; legacyCocoaPrice = p; }
            else if (k === '黑糖粉') { legacyBrown = true; legacyBrownPrice = p; }
            else if (k === '肉桂粉') { legacyCin = true; legacyCinPrice = p; }
            else if (k) { addCustomAddonRow(k, p, true); }
          });
        }

        document.getElementById('opt-ice').checked = !!opts.ice;
        document.getElementById('opt-hot').checked = !!opts.hot;
        document.getElementById('opt-bean5').checked = !!opts.bean5;
        document.getElementById('price-bean5').value = opts.priceBean5 ?? 0;
        document.getElementById('opt-bean1').checked = !!opts.bean1;
        document.getElementById('price-bean1').value = opts.priceBean1 ?? 0;

        document.getElementById('opt-sugar-free').checked = !!opts.sugarFree;
        document.getElementById('price-sugar-free').value = opts.priceSugarFree ?? 0;
        document.getElementById('opt-sugar-micro').checked = !!opts.sugarMicro;
        document.getElementById('price-sugar-micro').value = opts.priceSugarMicro ?? 0;
        document.getElementById('opt-sugar-half').checked = !!opts.sugarHalf;
        document.getElementById('price-sugar-half').value = opts.priceSugarHalf ?? 0;
        document.getElementById('opt-sugar-normal').checked = !!opts.sugarNormal;
        document.getElementById('price-sugar-normal').value = opts.priceSugarNormal ?? 0;

        document.getElementById('opt-addon-shot').checked = opts.addonShot !== undefined ? !!opts.addonShot : legacyShot;
        document.getElementById('price-addon-shot').value = opts.priceAddonShot ?? legacyShotPrice;

        document.getElementById('opt-addon-oat').checked = opts.addonOat !== undefined ? !!opts.addonOat : legacyOat;
        document.getElementById('price-addon-oat').value = opts.priceAddonOat ?? legacyOatPrice;

        document.getElementById('opt-addon-cocoa').checked = opts.addonCocoa !== undefined ? !!opts.addonCocoa : legacyCocoa;
        document.getElementById('price-addon-cocoa').value = opts.priceAddonCocoa ?? legacyCocoaPrice;

        document.getElementById('opt-addon-brownsugar').checked = opts.addonBrownSugar !== undefined ? !!opts.addonBrownSugar : legacyBrown;
        document.getElementById('price-addon-brownsugar').value = opts.priceAddonBrownSugar ?? legacyBrownPrice;

        document.getElementById('opt-addon-cinnamon').checked = opts.addonCinnamon !== undefined ? !!opts.addonCinnamon : legacyCin;
        document.getElementById('price-addon-cinnamon').value = opts.priceAddonCinnamon ?? legacyCinPrice;

        if (Array.isArray(opts.extraAddons)) {
          opts.extraAddons.forEach(a => addCustomAddonRow(a.name, a.price, a.enabled));
        }
      }

      document.getElementById('item-modal').classList.remove('hidden');
    };

    window.saveItemModal = async function() {

      const catName = document.getElementById('edit-cat-name').value;
      const itemId = document.getElementById('edit-item-id').value;
      const newName = document.getElementById('edit-name').value.trim();
      const newPrice = Number(document.getElementById('edit-price').value);
      const newDesc = document.getElementById('edit-desc').value.trim();

      if (!newName || !newPrice) { alert('請填寫品項名稱與基本價格！'); return; }

      const extraAddons = [];
      document.querySelectorAll('.extra-addon-row').forEach(row => {
        const enabled = row.querySelector('.extra-addon-check').checked;
        const name = row.querySelector('.extra-addon-name').value.trim();
        const price = Number(row.querySelector('.extra-addon-price').value) || 0;
        if (name) extraAddons.push({ name, price, enabled });
      });

      const newOptions = {
        ice: document.getElementById('opt-ice').checked,
        hot: document.getElementById('opt-hot').checked,
        bean5: document.getElementById('opt-bean5').checked,
        priceBean5: Number(document.getElementById('price-bean5').value) || 0,
        bean1: document.getElementById('opt-bean1').checked,
        priceBean1: Number(document.getElementById('price-bean1').value) || 0,
        sugarFree: document.getElementById('opt-sugar-free').checked,
        priceSugarFree: Number(document.getElementById('price-sugar-free').value) || 0,
        sugarMicro: document.getElementById('opt-sugar-micro').checked,
        priceSugarMicro: Number(document.getElementById('price-sugar-micro').value) || 0,
        sugarHalf: document.getElementById('opt-sugar-half').checked,
        priceSugarHalf: Number(document.getElementById('price-sugar-half').value) || 0,
        sugarNormal: document.getElementById('opt-sugar-normal').checked,
        priceSugarNormal: Number(document.getElementById('price-sugar-normal').value) || 0,
        addonShot: document.getElementById('opt-addon-shot').checked,
        priceAddonShot: Number(document.getElementById('price-addon-shot').value) || 0,
        addonOat: document.getElementById('opt-addon-oat').checked,
        priceAddonOat: Number(document.getElementById('price-addon-oat').value) || 0,
        addonCocoa: document.getElementById('opt-addon-cocoa').checked,
        priceAddonCocoa: Number(document.getElementById('price-addon-cocoa').value) || 0,
        addonBrownSugar: document.getElementById('opt-addon-brownsugar').checked,
        priceAddonBrownSugar: Number(document.getElementById('price-addon-brownsugar').value) || 0,
        addonCinnamon: document.getElementById('opt-addon-cinnamon').checked,
        priceAddonCinnamon: Number(document.getElementById('price-addon-cinnamon').value) || 0,
        extraAddons: extraAddons
      };

      try {
        let catObj = cachedCatalog.find(c => c.category === catName);
        if (!catObj) {
          catObj = { order: cachedCatalog.length + 1, category: catName, items: [] };
        }
        if (mode === 'add') {
          catObj.items.push({ id: itemId, name: newName, price: newPrice, desc: newDesc, options: newOptions, customRules: "", soldOut: false });
        } else {
          catObj.items = catObj.items.map(i => i.id === itemId ? { ...i, name: newName, price: newPrice, desc: newDesc, options: newOptions, customRules: "" } : i);
        }
        await setDoc(doc(db, "menu", catName), catObj);
        closeItemModal();
        loadAdminMenu();
      } catch (e) { console.error(e); alert("儲存失敗"); }
    };

    window.deleteItem = async function(categoryName, itemId) {
      if (!confirm("確定要刪除這個品項嗎？")) return;
      try {
        const catObj = cachedCatalog.find(c => c.category === categoryName);
        catObj.items = catObj.items.filter(i => i.id !== itemId);
        await setDoc(doc(db, "menu", categoryName), catObj);
        loadAdminMenu();
      } catch (e) { console.error(e); alert("刪除失敗"); }
    };

    window.toggleSoldOut = async function(categoryName, itemId, newStatus) {
      try {
        const catObj = cachedCatalog.find(c => c.category === categoryName);
        catObj.items = catObj.items.map(i => i.id === itemId ? { ...i, soldOut: newStatus } : i);
        await setDoc(doc(db, "menu", categoryName), catObj);
        loadAdminMenu();
      } catch (e) { console.error(e); alert("更新失敗"); }
    };

    // 即時訂單監聽與統計
    const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      const container = document.getElementById("orders-container");
      const completedContainer = document.getElementById("completed-orders-container");
      const pendingOrders = [];
      const completedOrders = [];
      let todayRevenue = 0;

      const todayStr = new Date().toLocaleDateString('zh-TW');

      snapshot.forEach(d => {
        const data = d.data();
        const orderDate = data.createdAt?.toDate ? data.createdAt.toDate() : new Date();
        const isToday = orderDate.toLocaleDateString('zh-TW') === todayStr;

        if (data.status === "pending") {
          pendingOrders.push({ id: d.id, time: orderDate, ...data });
          if (!isFirstOrderLoad && !knownPendingIds.has(d.id)) {
            playNotificationBeep();
          }
          knownPendingIds.add(d.id);
        } else if (data.status === "completed" && isToday) {
          completedOrders.push({ id: d.id, time: orderDate, ...data });
          todayRevenue += Number(data.totalAmount || 0);
        }
      });
      isFirstOrderLoad = false;

      document.getElementById('stat-pending').innerText = `${pendingOrders.length} 筆`;
      document.getElementById('stat-completed').innerText = `${completedOrders.length} 筆`;
      document.getElementById('stat-revenue').innerText = `NT$${todayRevenue}`;

      if (pendingOrders.length === 0) {
        container.innerHTML = `<p class="text-gray-400 text-sm py-6 text-center">目前沒有待處理的新訂單...</p>`;
      } else {
        container.innerHTML = pendingOrders.map(order => {
          const timeStr = order.time.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
          return `
            <div class="border-2 border-amber-500 bg-amber-50/40 p-4 rounded-2xl shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div class="space-y-1.5">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="bg-amber-600 text-white text-xs font-extrabold px-2.5 py-1 rounded-full">${order.orderType || '外帶自取'}</span>
                  <span class="text-xs text-gray-500 font-bold">🕒 ${timeStr}</span>
                  <h3 class="font-extrabold text-base text-gray-900">${order.customerInfo}</h3>
                </div>
                <div class="mt-2 space-y-1 text-sm text-gray-800">
                  ${order.items.map(i => `<p>• <b>${i.name}</b> x${i.qty} <span class="text-xs text-[#213c64] font-bold">(${i.modifiers.join(' / ') || '無客製'})</span> ${i.note ? `<span class="text-xs bg-red-100 text-red-700 px-1.5 py-0.5 rounded font-bold">備註: ${i.note}</span>` : ''}</p>`).join('')}
                </div>
                <p class="font-extrabold text-amber-900 pt-1 text-sm">應收總計：NT$${order.totalAmount}</p>
              </div>
              <div class="flex gap-2 w-full md:w-auto">
                <button onclick="completeOrder('${order.id}')" class="flex-1 md:flex-initial bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-3 rounded-xl font-extrabold text-sm shadow transition">
                  ✓ 完成製作 (通知取餐)
                </button>
                <button onclick="cancelOrder('${order.id}')" class="bg-gray-200 hover:bg-red-100 hover:text-red-600 text-gray-600 px-3 py-3 rounded-xl font-bold text-xs transition">
                  取消
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      if (completedOrders.length === 0) {
        completedContainer.innerHTML = `<p class="text-xs text-gray-400">尚無今日已完成訂單</p>`;
      } else {
        completedContainer.innerHTML = completedOrders.map(o => `
          <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-xl border text-xs">
            <div>
              <span class="font-bold text-gray-800">${o.customerInfo}</span>
              <span class="text-gray-500 ml-2">${o.items.map(i => `${i.name}x${i.qty}`).join(', ')}</span>
            </div>
            <span class="font-extrabold text-emerald-700">NT$${o.totalAmount}</span>
          </div>
        `).join('');
      }
    });

    window.completeOrder = async function(orderId) {
      await updateDoc(doc(db, "orders", orderId), { status: "completed" });
    };

    window.cancelOrder = async function(orderId) {
      if (!confirm("確定要取消並刪除這筆訂單嗎？")) return;
      await deleteDoc(doc(db, "orders", orderId));
    };

    loadAdminMenu();
  </script>
</body>
</html>
