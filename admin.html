<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NODAY Coffee Roasters | 吧台接單與後台管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-12">

  <header class="bg-[#213c64] text-white p-4 shadow flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold">☕ NODAY 吧台管理後台</h1>
      <p class="text-xs text-gray-200 mt-0.5">即時接單看板 ＆ 獨立品項客製管理</p>
    </div>
    <div class="flex gap-2">
      <button onclick="openAddItemModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-xs font-bold shadow">
        ＋ 新增品項
      </button>
      <button onclick="initMenuToFirebase()" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-2 rounded-lg text-xs font-bold shadow">
        ⚡ 還原預設菜單
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6 mt-4">
    <!-- 即時接單區 -->
    <section class="bg-white p-5 rounded-2xl shadow-sm">
      <h2 class="text-base font-extrabold text-gray-900 mb-3 flex items-center justify-between">
        <span>🔔 即時新訂單看板</span>
        <span class="text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded-full font-bold">新單自動提醒</span>
      </h2>
      <div id="orders-container" class="space-y-3">
        <p class="text-gray-400 text-sm py-4 text-center">目前沒有待處理的訂單...</p>
      </div>
    </section>

    <!-- 菜單管理區 -->
    <section class="bg-white p-5 rounded-2xl shadow-sm">
      <h2 class="text-base font-extrabold text-gray-900 mb-2">🛠️ 雲端菜單與獨立客製選項管理</h2>
      <p class="text-xs text-gray-500 mb-4">您可以針對「每一個單獨品項」自由調整價格、描述，或勾選這杯飲料要提供的客製選項！</p>
      <div id="admin-menu-list" class="space-y-4">
        <p class="text-gray-400 text-sm">正在載入菜單...</p>
      </div>
    </section>
  </main>

  <!-- 編輯品項 Modal -->
  <div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <h3 class="text-lg font-bold text-gray-900">修改品項與獨立客製選項</h3>
      <input type="hidden" id="edit-cat-name">
      <input type="hidden" id="edit-item-id">
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-bold text-gray-600">品項名稱</label>
          <input type="text" id="edit-name" class="w-full border rounded-lg p-2.5 text-sm mt-1 focus:outline-none focus:border-[#2b4c7e]">
        </div>
        <div>
          <label class="text-xs font-bold text-gray-600">基本價格 (NT$)</label>
          <input type="number" id="edit-price" class="w-full border rounded-lg p-2.5 text-sm mt-1 focus:outline-none focus:border-[#2b4c7e]">
        </div>
      </div>

      <div>
        <label class="text-xs font-bold text-gray-600">品項描述 (容量/風味說明)</label>
        <input type="text" id="edit-desc" class="w-full border rounded-lg p-2.5 text-sm mt-1 focus:outline-none focus:border-[#2b4c7e]">
      </div>

      <!-- 獨立客製選項勾選區 -->
      <div class="border rounded-xl p-3 bg-gray-50 space-y-3">
        <label class="text-xs font-bold text-[#213c64] block">勾選此品項要提供的客製選項：</label>
        
        <div class="space-y-2 text-xs">
          <label class="flex items-center gap-2 bg-white p-2 rounded border cursor-pointer">
            <input type="checkbox" id="opt-temp" class="w-4 h-4 text-[#213c64]">
            <span class="font-bold">提供「飲品溫度」選項 (冰 / 熱)</span>
          </label>
          
          <label class="flex items-center gap-2 bg-white p-2 rounded border cursor-pointer">
            <input type="checkbox" id="opt-bean" class="w-4 h-4 text-[#213c64]">
            <span class="font-bold">提供「配方豆選擇」選項 (5號配方 / 1號配方等)</span>
          </label>

          <label class="flex items-center gap-2 bg-white p-2 rounded border cursor-pointer">
            <input type="checkbox" id="opt-sugar" class="w-4 h-4 text-[#213c64]">
            <span class="font-bold">提供「甜度調整」選項 (正常/半糖/微糖/無糖)</span>
          </label>

          <label class="flex items-center gap-2 bg-white p-2 rounded border cursor-pointer">
            <input type="checkbox" id="opt-addons" class="w-4 h-4 text-[#213c64]">
            <span class="font-bold">提供「加購選項」 (例如雙倍濃縮 +NT$20)</span>
          </label>
        </div>
      </div>

      <div class="flex gap-3 pt-2">
        <button onclick="closeEditModal()" class="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-lg font-bold text-sm">取消</button>
        <button onclick="saveItemChanges()" class="flex-1 bg-[#2b4c7e] text-white py-2.5 rounded-lg font-bold text-sm">儲存修改</button>
      </div>
    </div>
  </div>

            <input type="checkbox" id="add-opt-sugar" class="w-4 h-4 text-[#213c64]">
            <span class="font-bold">提供「甜度調整」選項</span>

            <span class="font-bold">提供「加購選項」 (雙倍濃縮)</span>
          </label>
        </div>
      </div>

      <div class="flex gap-3 pt-2">

        <button onclick="confirmAddNewItem()" class="flex-1 bg-emerald-600 text-white py-2.5 rounded-lg font-bold text-sm">確認新增</button>

          { id: "s3", name: "桂花釀拿鐵", price: 130, desc: "奶香與花香的雙重爆擊！溫柔又濃郁的續命快樂水～", options: { temp: true, bean: true, sugar: false, addons: true }, soldOut: false },
          { id: "s4", name: "桂花釀拿鐵-大人味", price: 145, desc: "溫柔的陷阱｜添加純米大吟釀風味，專屬大人味的浪漫～", options: { temp: true, bean: true, sugar: false, addons: true }, soldOut: false }
        ]
      }
    ];

    window.initMenuToFirebase = async function() {
      if (!confirm("確定要將預設完整菜單（含獨立品項選項）重置並寫入雲端嗎？")) return;
      try {
        for (const cat of defaultMenuCatalog) {
          await setDoc(doc(db, "menu", cat.category), cat);
        }
        alert("🎉 菜單已成功還原！");
        loadAdminMenu();
      } catch (e) { console.error(e); alert("操作失敗"); }
    };

    async function loadAdminMenu() {
      const container = document.getElementById("admin-menu-list");
      try {
        const querySnapshot = await getDocs(collection(db, "menu"));
        if (querySnapshot.empty) {
          container.innerHTML = `<p class="text-amber-600 text-sm">尚無菜單，請點擊右上角「還原預設菜單」初始化。</p>`;
          return;
        }
        cachedCatalog = [];
        querySnapshot.forEach(d => cachedCatalog.push(d.data()));
        cachedCatalog.sort((a, b) => a.order - b.order);

        container.innerHTML = cachedCatalog.map(cat => `
          <div class="border rounded-xl p-4 bg-gray-50">
            <h3 class="font-bold text-gray-900 mb-3">${cat.category}</h3>
            <div class="space-y-2">
              ${cat.items.map(item => `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-3 rounded-lg border gap-2">
                  <div>
                    <p class="font-bold text-sm text-gray-800">${item.name} <span class="text-xs text-[#2b4c7e] ml-2">NT$${item.price}</span></p>
                    ${item.desc ? `<p class="text-xs text-gray-500 mt-0.5">${item.desc}</p>` : ''}
                    <div class="flex gap-1 mt-1">
                      <span class="text-[10px] bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded">${item.options?.temp ? '冰熱✓' : '冰熱✕'}</span>
                      <span class="text-[10px] bg-purple-50 text-purple-700 px-1.5 py-0.5 rounded">${item.options?.bean ? '配方豆✓' : '配方豆✕'}</span>
                      <span class="text-[10px] bg-amber-50 text-amber-700 px-1.5 py-0.5 rounded">${item.options?.sugar ? '甜度✓' : '甜度✕'}</span>
                      <span class="text-[10px] bg-emerald-50 text-emerald-700 px-1.5 py-0.5 rounded">${item.options?.addons ? '加購✓' : '加購✕'}</span>
                    </div>
                  </div>
                  <div class="flex items-center gap-2 self-end sm:self-auto">
                    <button onclick="openEditModal('${cat.category}', '${item.id}')" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-xs font-bold">修改</button>
                    <button onclick="deleteItem('${cat.category}', '${item.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold">刪除</button>
                    <button onclick="toggleSoldOut('${cat.category}', '${item.id}', ${!item.soldOut})" class="px-3 py-1.5 rounded-lg text-xs font-bold ${item.soldOut ? 'bg-red-500 text-white' : 'bg-gray-100 text-gray-700'}">
                      ${item.soldOut ? '已售完' : '販售中'}
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('');
      } catch (e) { console.error(e); }
    }

    window.openEditModal = function(categoryName, itemId) {
      let targetItem = null;
      const cat = cachedCatalog.find(c => c.category === categoryName);
      if (cat) targetItem = cat.items.find(i => i.id === itemId);
      if (!targetItem) return;

      document.getElementById('edit-cat-name').value = categoryName;
      document.getElementById('edit-item-id').value = itemId;
      document.getElementById('edit-name').value = targetItem.name;
      document.getElementById('edit-price').value = targetItem.price;
      document.getElementById('edit-desc').value = targetItem.desc || '';
      
      const opts = targetItem.options || { temp: true, bean: true, sugar: false, addons: true };
      document.getElementById('opt-temp').checked = !!opts.temp;
      document.getElementById('opt-bean').checked = !!opts.bean;
      document.getElementById('opt-sugar').checked = !!opts.sugar;
      document.getElementById('opt-addons').checked = !!opts.addons;

      document.getElementById('edit-modal').classList.remove('hidden');
    };

    window.closeEditModal = function() {
      document.getElementById('edit-modal').classList.add('hidden');
    };

    window.saveItemChanges = async function() {
      const catName = document.getElementById('edit-cat-name').value;
      const itemId = document.getElementById('edit-item-id').value;
      const newName = document.getElementById('edit-name').value.trim();
      const newPrice = Number(document.getElementById('edit-price').value);
      const newDesc = document.getElementById('edit-desc').value.trim();
      
      const newOptions = {
        temp: document.getElementById('opt-temp').checked,
        bean: document.getElementById('opt-bean').checked,
        sugar: document.getElementById('opt-sugar').checked,
        addons: document.getElementById('opt-addons').checked
      };

      if (!newName || !newPrice) { alert('請填寫品項名稱與價格！'); return; }

      try {
        const catObj = cachedCatalog.find(c => c.category === catName);
        catObj.items = catObj.items.map(i => i.id === itemId ? { ...i, name: newName, price: newPrice, desc: newDesc, options: newOptions } : i);
        await setDoc(doc(db, "menu", catName), catObj);
        closeEditModal();
        loadAdminMenu();
        alert("✅ 修改成功！該品項的獨立客製選項已即時更新。");
      } catch (e) { console.error(e); alert("儲存失敗"); }
    };

    window.openAddItemModal = function() {
      document.getElementById('add-name').value = '';
      document.getElementById('add-price').value = '';
      document.getElementById('add-desc').value = '';
      document.getElementById('add-modal').classList.remove('hidden');
    };

    window.closeAddModal = function() {
      document.getElementById('add-modal').classList.add('hidden');
    };

    window.confirmAddNewItem = async function() {
      const catName = document.getElementById('add-cat').value;
      const name = document.getElementById('add-name').value.trim();
      const price = Number(document.getElementById('add-price').value);
      const desc = document.getElementById('add-desc').value.trim();
      
      const newOptions = {
        temp: document.getElementById('add-opt-temp').checked,
        bean: document.getElementById('add-opt-bean').checked,
        sugar: document.getElementById('add-opt-sugar').checked,
        addons: document.getElementById('add-opt-addons').checked
      };

      if (!name || !price) { alert('請填寫品項名稱與價格！'); return; }

      try {
        let catObj = cachedCatalog.find(c => c.category === catName);
        if (!catObj) {
          catObj = { order: 8, category: catName, items: [] };
        }
        const newItem = { id: 'item_' + Date.now(), name, price, desc, options: newOptions, soldOut: false };
        catObj.items.push(newItem);
        await setDoc(doc(db, "menu", catName), catObj);
        closeAddModal();
        loadAdminMenu();
        alert("✅ 新增獨立品項成功！");
      } catch (e) { console.error(e); alert("新增失敗"); }
    };

    window.deleteItem = async function(categoryName, itemId) {
      if (!confirm("確定要刪除這個品項嗎？")) return;
      try {
        const catObj = cachedCatalog.find(c => c.category === categoryName);
        catObj.items = catObj.items.filter(i => i.id !== itemId);
        await setDoc(doc(db, "menu", categoryName), catObj);
        loadAdminMenu();
      } catch (e) { console.error(e); alert("刪除失敗"); }
    };

    window.toggleSoldOut = async function(categoryName, itemId, newStatus) {
      try {
        const catObj = cachedCatalog.find(c => c.category === categoryName);
        catObj.items = catObj.items.map(i => i.id === itemId ? { ...i, soldOut: newStatus } : i);
        await setDoc(doc(db, "menu", categoryName), catObj);
        loadAdminMenu();
      } catch (e) { console.error(e); alert("更新失敗"); }
    };

    const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      const container = document.getElementById("orders-container");
      const pendingOrders = [];
      snapshot.forEach(d => { if (d.data().status === "pending") pendingOrders.push({ id: d.id, ...d.data() }); });

      if (pendingOrders.length === 0) {
        container.innerHTML = `<p class="text-gray-400 text-sm py-4 text-center">目前沒有待處理的新訂單...</p>`;
        return;
      }

      container.innerHTML = pendingOrders.map(order => `
        <div class="border-2 border-amber-500 bg-amber-50/40 p-4 rounded-xl shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
          <div>
            <div class="flex items-center space-x-2">
              <span class="bg-amber-600 text-white text-xs font-extrabold px-2.5 py-1 rounded-full">${order.orderType}</span>
              <h3 class="font-extrabold text-base text-gray-900">${order.customerInfo}</h3>
            </div>
            <div class="mt-2 space-y-1 text-sm text-gray-700">
              ${order.items.map(i => `<p>• <b>${i.name}</b> x${i.qty} <span class="text-xs text-gray-500">(${i.modifiers.join(', ')})</span> ${i.note ? `[備註: ${i.note}]` : ''}</p>`).join('')}
            </div>
            <p class="font-extrabold text-amber-900 mt-2 text-sm">總金額：NT$${order.totalAmount}</p>
          </div>
          <button onclick="completeOrder('${order.id}')" class="w-full md:w-auto bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-3 rounded-xl font-bold text-sm shadow">
            ✓ 完成製作 (結單)
          </button>
        </div>
      `).join('');
    });

    window.completeOrder = async function(orderId) {
      await updateDoc(doc(db, "orders", orderId), { status: "completed" });
    };

    loadAdminMenu();
  </script>
</body>
</html>
