    // 一鍵初始化寫入 Firebase
    window.initMenuToFirebase = async function() {
      if (!confirm("確定要將完整預設菜單寫入 Firebase 雲端資料庫嗎？")) return;
      try {
        for (const cat of defaultMenuCatalog) {
          await setDoc(doc(db, "menu", cat.category), cat);
        }
        alert("🎉 菜單初始化成功！客人端重新整理即可看到完整菜單。");
        loadAdminMenu();
      } catch (e) {
        console.error(e);
        alert("初始化失敗，請檢查權限設定。");
      }
    };

    // 載入後台菜單管理列表
    async function loadAdminMenu() {
      const container = document.getElementById("admin-menu-list");
      try {
        const querySnapshot = await getDocs(collection(db, "menu"));
        if (querySnapshot.empty) {
          container.innerHTML = `<p class="text-amber-600 text-sm">目前資料庫無菜單，請點擊右上角「一鍵初始化完整菜單」。</p>`;
          return;
        }
        let categories = [];
        querySnapshot.forEach(doc => categories.push(doc.data()));
        categories.sort((a, b) => a.order - b.order);

        container.innerHTML = categories.map(cat => `
          <div class="border rounded-xl p-4 bg-gray-50">
            <h3 class="font-bold text-gray-900 mb-3">${cat.category}</h3>
            <div class="space-y-2">
              ${cat.items.map(item => `
                <div class="flex justify-between items-center bg-white p-3 rounded-lg border">
                  <div>
                    <p class="font-bold text-sm text-gray-800">${item.name} <span class="text-xs text-gray-500 ml-2">NT$${item.price}</span></p>
                    ${item.desc ? `<p class="text-xs text-gray-400 mt-0.5">${item.desc}</p>` : ''}
                  </div>
                  <button onclick="toggleSoldOut('${cat.category}', '${item.id}', ${!item.soldOut})" class="px-3 py-1.5 rounded-lg text-xs font-bold ${item.soldOut ? 'bg-red-500 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}">
                    ${item.soldOut ? '已售完 (點擊恢復)' : '設為售完'}
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error(e);
      }
    }

    // 切換售完狀態
    window.toggleSoldOut = async function(categoryName, itemId, newStatus) {
      try {
        const querySnapshot = await getDocs(collection(db, "menu"));
        let targetCat = null;
        querySnapshot.forEach(d => {
          if (d.data().category === categoryName) targetCat = { id: d.id, ...d.data() };
        });

        if (targetCat) {
          targetCat.items = targetCat.items.map(i => i.id === itemId ? { ...i, soldOut: newStatus } : i);
          await setDoc(doc(db, "menu", targetCat.id), targetCat);
          loadAdminMenu();
        }
      } catch (e) {
        console.error(e);
        alert("更新失敗");
      }
    };

    // 即時監聽訂單
    function listenOrders() {
      const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
      onSnapshot(q, (snapshot) => {
        const container = document.getElementById("orders-container");
        const pendingOrders = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          if (data.status === "pending") {
            pendingOrders.push({ id: doc.id, ...data });
          }
        });

        if (pendingOrders.length === 0) {
          container.innerHTML = `<p class="text-gray-400 text-sm py-4 text-center">目前沒有待處理的新訂單...</p>`;
          return;
        }

        container.innerHTML = pendingOrders.map(order => `
          <div class="border-2 border-amber-500 bg-amber-50/40 p-4 rounded-xl shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <div class="flex items-center space-x-2">
                <span class="bg-amber-600 text-white text-xs font-extrabold px-2.5 py-1 rounded-full">${order.orderType}</span>
                <h3 class="font-extrabold text-base text-gray-900">${order.customerInfo}</h3>
                <span class="text-xs text-gray-400">${order.createdAt ? new Date(order.createdAt.toDate()).toLocaleTimeString() : ''}</span>
              </div>
              <div class="mt-2 space-y-1 text-sm text-gray-700">
                ${order.items.map(i => `
                  <p>• <b>${i.name}</b> x${i.qty} <span class="text-xs text-gray-500">(${i.modifiers.join(', ')})</span> ${i.note ? `[備註: ${i.note}]` : ''}</p>
                `).join('')}
              </div>
              <p class="font-extrabold text-amber-900 mt-2 text-sm">總金額：NT$${order.totalAmount}</p>
            </div>
            <button onclick="completeOrder('${order.id}')" class="w-full md:w-auto bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-3 rounded-xl font-bold text-sm shadow">
              ✓ 完成製作 (結單)
            </button>
          </div>
        `).join('');
      });
    }

    window.completeOrder = async function(orderId) {
      try {
        await updateDoc(doc(db, "orders", orderId), { status: "completed" });
      } catch (e) {
        console.error(e);
        alert("操作失敗");
      }
    };

    loadAdminMenu();
    listenOrders();
  </script>
